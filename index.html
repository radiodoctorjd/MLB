/* Convert met. wind direction (where wind comes FROM) to field-relative description */
function windToField(windFromDeg, parkHomeDir) {
  // windFromDeg = direction wind is coming FROM (meteorological)
  // parkHomeDir = bearing FROM CF toward home plate
  // We want to say wind is blowing "in/out" and toward which field zone
  const cfDir = (parkHomeDir + 180) % 360; // bearing from home plate toward CF
  // angle of wind blowing toward, relative to CF direction
  const windToDeg = (windFromDeg + 180) % 360;
  let diff = ((windToDeg - cfDir) % 360 + 360) % 360;

  // In vs out
  let inOut;
  if (diff > 315 || diff <= 45)  inOut = 'out';
  else if (diff > 135 && diff <= 225) inOut = 'in';
  else inOut = 'across';

  // Field zone
  let zone;
  if (diff > 315 || diff <= 45)  zone = 'to center';
  else if (diff > 45 && diff <= 90)  zone = 'out to right-center';
  else if (diff > 90 && diff <= 135) zone = 'out to right';
  else if (diff > 135 && diff <= 180) zone = 'in from right';
  else if (diff > 180 && diff <= 225) zone = 'in from left';
  else if (diff > 225 && diff <= 270) zone = 'out to left';
  else zone = 'out to left-center';

  if (inOut === 'across') {
    zone = diff > 45 && diff <= 135 ? 'blowing right to left' : 'blowing left to right';
  }
  return zone;
}

async function fetchCSV(gid){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status} fetching gid=${gid}`);
  return parseCSV(await r.text());
}
function parseCSV(txt){
  // Full RFC-4180 parser: handles quoted fields with embedded newlines and commas.
  const rows=[];
  let cur='', inQ=false, row=[];
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(c==='"'){
      if(inQ&&txt[i+1]==='"'){cur+='"';i++;}  // escaped quote
      else inQ=!inQ;
    } else if(c===','&&!inQ){
      row.push(cur.replace(/\n/g,' ').trim()); cur='';  // collapse embedded newlines to space
    } else if((c==='\n'||c==='\r')&&!inQ){
      if(c==='\r'&&txt[i+1]==='\n') i++;  // skip \r in \r\n
      row.push(cur.replace(/\n/g,' ').trim()); cur='';
      if(row.some(c=>c)) rows.push(row);
      row=[];
    } else {
      cur+=c;
    }
  }
  if(cur||row.length){row.push(cur.replace(/\n/g,' ').trim());if(row.some(c=>c))rows.push(row);}
  return rows;
}
function csvToObjects(rows){
  if(!rows||!rows.length) return [];
  // find header row — skip emoji title rows, empty rows, and section-header rows
  // A valid header row must have at least 2 non-empty cells (real column headers)
  let hi=0;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const f=(rows[i][0]||'');
    // Skip emoji-prefixed title rows
    if(/[\u{1F300}-\u{1FFFF}]/u.test(f)||f.startsWith('📅')||f.startsWith('📊')||f.startsWith('⚾')||f.startsWith('🔥')||f.startsWith('🏟')||f.startsWith('📈')||f.startsWith('🎰')) continue;
    // Skip fully empty rows
    if(rows[i].every(c=>!c)) continue;
    // Skip section-header rows — rows where only the first cell has content (like "SECTION 1 — ...")
    const nonEmpty = rows[i].filter(c=>c.trim());
    if(nonEmpty.length < 2) continue;
    hi=i; break;
  }
  const headers=rows[hi].map(h=>h.replace(/\n/g,' ').replace(/[^\w\s/%().⭐🔥❄️➡📈📉-]/g,'').trim());
  return rows.slice(hi+1).filter(r=>r.some(c=>c)).map(row=>{
    const o={};
    headers.forEach((h,i)=>{o[h]=(row[i]||'').trim();});
    return o;
  });
}

/* ─────────────────────────────────────────────
   BULLPEN CSV PARSER
   The Bullpen sheet has a specific structure:
   - emoji title row
   - "SECTION 1 — TEAM BULLPEN SUMMARY" section label
   - actual header row: Team, BP ERA, BP WHIP, Saves, Holds, Blown Saves, Save%, K/9, ...
   - data rows
   - then a second section with pitcher-level data
   We specifically look for the header row containing "BP ERA"
───────────────────────────────────────────── */
function parseBullpenCSV(rows){
  // Bullpen sheet header is now parsed correctly by RFC4180 parseCSV:
  // "Blown\nSaves" comes through as "Blown Saves" in a single cell.
  // No special two-row merging needed — delegate to csvToObjects.
  return csvToObjects(rows);
}

async function loadAll(){
  setMain(`<div class="status-wrap"><span class="spinner"></span>Loading from Google Sheets…</div>`);
  try{
    const ystPromise=GIDS.yesterday?fetchCSV(GIDS.yesterday).catch(()=>[]):Promise.resolve([]);
    const statcastPromise=GIDS.statcast?fetchCSV(GIDS.statcast).catch(()=>[]):Promise.resolve([]);
    const [sched,preds,totals,pitchers,bullpen,parkWx,teamStats,advanced,yst,statcast]=await Promise.all([
      fetchCSV(GIDS.schedule),fetchCSV(GIDS.predictions),fetchCSV(GIDS.teamTotals),
      fetchCSV(GIDS.pitchers),fetchCSV(GIDS.bullpen),fetchCSV(GIDS.parkWeather),
      fetchCSV(GIDS.teamStats),fetchCSV(GIDS.advanced),ystPromise,statcastPromise,
    ]);
    DATA.schedule   = processSchedule(sched);
    DATA.predictions= csvToObjects(preds);
    DATA.totals     = csvToObjects(totals);
    DATA.pitchers   = csvToObjects(pitchers);
    DATA.bullpen    = parseBullpenCSV(bullpen);
    DATA.parkWx     = csvToObjects(parkWx);
    DATA.teamStats  = csvToObjects(teamStats);
    DATA.advanced   = processAdvanced(advanced);
    DATA.yesterday  = GIDS.yesterday ? csvToObjects(yst) : [];
    DATA.statcast   = indexByAbbr(GIDS.statcast ? csvToObjects(statcast) : []);
    buildGames();
    renderTab(currentTab);
    fetchWeatherAll();
    loadSyncStatus(); // separate, non-blocking — never delays the main dashboard
  }catch(e){
    setMain(`<div class="status-wrap"><div class="err"><strong>Could not load data.</strong><br>Make sure your sheet is shared as \"Anyone with the link can view.\"<br><small style="opacity:.7">${e.message}</small></div></div>`);
  }
}

/* ─────────────────────────────────────────────
   SYNC STATUS — "Data last refreshed" pill
   Reads the '⏱️ Meta' tab written by stampLastRefreshed_() in the
   Apps Script. Failures here are silent (pill just stays at '—')
   since this is a nice-to-have, not core dashboard functionality.
───────────────────────────────────────────── */
async function loadSyncStatus(){
  const pill=document.getElementById('sync-pill');
  const text=document.getElementById('sync-pill-text');
  if(!GIDS.meta){ text.textContent='sync time not configured'; return; }
  try{
    const rows=await fetchCSV(GIDS.meta);
    const meta=csvToObjects(rows);
    const isoRow=meta.find(r=>r['Key']==='lastRefreshedISO');
    const dispRow=meta.find(r=>r['Key']==='lastRefreshedDisplay');
    if(!isoRow||!isoRow['Value']){ text.textContent='unknown'; return; }
    const refreshedAt=new Date(isoRow['Value']);
    if(isNaN(refreshedAt.getTime())){ text.textContent=dispRow?.['Value']||'unknown'; return; }
    text.textContent='Updated '+relativeTime(refreshedAt);
    pill.title='Data last refreshed: '+(dispRow?.['Value']||refreshedAt.toLocaleString());
    // Flag as stale if the sheet hasn't refreshed in over 3 hours —
    // the daily trigger runs once a day, so this mainly catches a
    // broken/stuck Apps Script trigger rather than normal gaps.
    const hoursSince=(Date.now()-refreshedAt.getTime())/36e5;
    pill.classList.toggle('stale', hoursSince>3);
  }catch(e){
    text.textContent='sync status unavailable';
  }
}

function relativeTime(d){
  const secs=Math.floor((Date.now()-d.getTime())/1000);
  if(secs<60) return 'just now';
  const mins=Math.floor(secs/60);
  if(mins<60) return mins+'m ago';
  const hrs=Math.floor(mins/60);
  if(hrs<24) return hrs+'h ago';
  const days=Math.floor(hrs/24);
  return days+'d ago';
}

function processSchedule(rows){
  const all=[];let section=null;
  for(const row of rows){
    const f=(row[0]||'').trim();
    if(f.includes('TODAY')){section='today';continue;}
    if(f.includes('TOMORROW')){section='tomorrow';continue;}
    if(!f||f.includes('Time')||f.startsWith('📅')) continue;
    if(section&&row[0]&&row[2]) all.push({_day:section,raw:row});
  }
  return all;
}

/* ─────────────────────────────────────────────
   PROCESS ADVANCED (multi-section sheet)
───────────────────────────────────────────── */
function processAdvanced(rows){
  const res={spForm:{},teamForm:{},h2h:{}};
  let section=null,headers=[];
  for(const row of rows){
    const f=(row[0]||'').trim();
    if(f.includes('SECTION 1')||f.includes('STARTING PITCHER')){section='sp';headers=[];continue;}
    if(f.includes('SECTION 2')||f.includes('TEAM FORM')){section='team';headers=[];continue;}
    if(f.includes('SECTION 3')||f.includes('HEAD-TO-HEAD')){section='h2h';headers=[];continue;}
    if(!f||row.every(c=>!c)) continue;
    const fl=f.toLowerCase();
    if(fl==='pitcher'||fl==='team'||fl==='matchup'){headers=row.map(h=>h.trim());continue;}
    if(!headers.length) continue;
    const obj={};headers.forEach((h,i)=>{obj[h]=(row[i]||'').trim();});
    if(section==='sp'  &&obj['Pitcher']) res.spForm[obj['Pitcher']]=obj;
    if(section==='team'&&obj['Abbr'])    res.teamForm[obj['Abbr']]=obj;
    if(section==='team'&&obj['Team']&&!obj['Abbr']) res.teamForm[obj['Team']]=obj;
    if(section==='h2h' &&obj['Matchup']) res.h2h[obj['Matchup']]=obj;
  }
  return res;
}

/* Statcast tab has the same shape as Team Stats: an emoji title row,
   then one header row, then 30 team rows. csvToObjects already skips
   the title row via its emoji-prefix detection, so this just re-keys
   the resulting objects by Abbr for O(1) lookup per game card. */
function indexByAbbr(rows){
  const out={};
  rows.forEach(r=>{ if(r['Abbr']) out[r['Abbr']]=r; });
  return out;
}

/* helpers */
function col(obj,...keys){
  if(!obj) return '';
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
  for(const k of keys){
    const nk=norm(k);
    // 1. Exact normalized match (fastest, most reliable)
    const exact=Object.keys(obj).find(ok=>norm(ok)===nk);
    if(exact&&obj[exact]) return obj[exact];
    // 2. Prefix match — key starts with search term (e.g. 'Away ERA' matches 'awayera')
    const prefix=Object.keys(obj).find(ok=>norm(ok).startsWith(nk)&&nk.length>=4);
    if(prefix&&obj[prefix]) return obj[prefix];
    // 3. Substring match — only when search term is ≥5 chars to avoid false positives
    if(nk.length>=5){
      const sub=Object.keys(obj).find(ok=>norm(ok).includes(nk)||nk.includes(norm(ok)));
      if(sub&&obj[sub]) return obj[sub];
    }
  }
  return '';
}
function rowMatch(row,away,home){
  const m=Object.values(row).join(' ').toLowerCase();
  return m.includes(away.split(' ').pop().toLowerCase())&&m.includes(home.split(' ').pop().toLowerCase());
}
function pf(s){ return s?parseFloat(s.replace('%',''))||null:null; }
// Clean K/9 values that Google Sheets may export as percentage-formatted decimals (e.g. "959.00%" → "9.59")
function cleanK9(s){
  if(!s||s==='—') return '—';
  // If value ends with % and is large (>20), it's a decimal stored as percent: divide by 100
  const m=s.match(/^([\d.]+)%$/);
  if(m){ const v=parseFloat(m[1]); return v>20?(v/100).toFixed(2):s; }
  return s;
}

/* ─────────────────────────────────────────────
   DATE HELPER — America/New_York LOCAL date
   FIX: Date.toISOString() returns UTC, which can
   land on the *next* calendar day in the evening
   (US Eastern). That mismatched the WEATHER cache
   keys built from Open-Meteo's timezone=auto (local)
   response against lookups keyed off UTC dates,
   so the cache lookup always missed and every card
   stayed stuck on "Loading weather…". This formats
   in the same local timezone the schedule uses.
───────────────────────────────────────────── */
function localDateStr(d){
  return new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}

/* ─────────────────────────────────────────────
   OPEN-METEO WEATHER (CORS-safe, no key)
───────────────────────────────────────────── */
async function fetchWeatherAll(){
  // Key WEATHER by "ABR:yyyy-mm-dd" so today/tomorrow get separate hourly slots
  const gameTimeMap={};
  const today=new Date();
  const todayStr=localDateStr(today);
  const tomorrowStr=localDateStr(new Date(today.getTime()+86400000));
  for(const g of [...todayGames,...tmrwGames]){
    if(!g.homeAbbr||!PARKS[g.homeAbbr]||PARKS[g.homeAbbr].roof) continue;
    let gameHour=19;
    if(g.time&&g.time!=='—'){
      const mtch=g.time.trim().match(/(\d+):(\d+)\s*(AM|PM)/i);
      if(mtch){let h=parseInt(mtch[1]);const pm=mtch[3].toUpperCase()==='PM';if(pm&&h!==12)h+=12;if(!pm&&h===12)h=0;gameHour=h;}
    }
    const dateStr=todayGames.includes(g)?todayStr:tomorrowStr;
    const key=g.homeAbbr+':'+dateStr;
    if(!gameTimeMap[key]) gameTimeMap[key]={abbr:g.homeAbbr,dateStr,gameHour};
  }
  const parkSet={};
  Object.values(gameTimeMap).forEach(({abbr})=>{ parkSet[abbr]=true; });
  const toFetch=Object.keys(parkSet);
  if(!toFetch.length){rerenderCards();return;}
  const lats=toFetch.map(a=>PARKS[a].lat).join(',');
  const lons=toFetch.map(a=>PARKS[a].lon).join(',');
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}`
    +`&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m`
    +`&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=2`;
  try{
    const resp=await fetch(url);
    if(!resp.ok) throw new Error(`Open-Meteo ${resp.status}`);
    const json=await resp.json();
    const results=Array.isArray(json)?json:[json];
    const locMap={};
    results.forEach((loc,i)=>{ locMap[toFetch[i]]=loc; });
    Object.entries(gameTimeMap).forEach(([key,{abbr,dateStr,gameHour}])=>{
      const loc=locMap[abbr];
      if(!loc?.hourly?.time) return;
      const times=loc.hourly.time;
      let hi=times.findIndex(t=>t&&t.startsWith(dateStr)&&parseInt(t.slice(11,13),10)===gameHour);
      if(hi===-1){const ds=times.findIndex(t=>t&&t.startsWith(dateStr));hi=ds!==-1?Math.min(ds+gameHour,times.length-1):0;}
      hi=Math.max(0,Math.min(hi,times.length-1));
      const h=loc.hourly;
      const code=h.weather_code?.[hi]??0;
      const windDeg=h.wind_direction_10m?.[hi]??0;
      const windSpd=h.wind_speed_10m?.[hi]??0;
      const windZone=windSpd>3?windToField(windDeg,PARKS[abbr].homeDir):null;
      WEATHER[key]={
        temp:Math.round(h.temperature_2m?.[hi]??70),code,
        cond:WX_CODE[code]||'Clear',icon:WX_ICON[code]||'🌤️',
        wind:Math.round(windSpd),windDir:windZone,
        precip:Math.round(h.precipitation_probability?.[hi]??0),
      };
    });
    rerenderCards();
  }catch(e){console.warn('Open-Meteo weather failed:',e);}
}
function wxLine(homeAbbr,gameTime,day){
  const park=PARKS[homeAbbr];
  if(!park||park.roof){
    return`<div class="wx-line"><span class="wx-ico">🏟️</span><span>Dome — weather not a factor</span></div>`;
  }
  const _td=localDateStr(new Date());
  const _tm=localDateStr(new Date(Date.now()+86400000));
  const wx=WEATHER[homeAbbr+':'+(day==='tomorrow'?_tm:_td)]||WEATHER[homeAbbr];
  if(!wx){
    return`<div class="wx-line"><span class="wx-ico" style="opacity:.4">⏳</span><span style="opacity:.5">Loading weather…</span></div>`;
  }
  const parts=[`${wx.temp}°`,wx.cond];
  if(wx.wind>3) parts.push(`Wind ${wx.wind} mph${wx.windDir?' '+wx.windDir:''}`);
  parts.push(`${wx.precip}% precip`);
  const tl=gameTime&&gameTime!=='—'?` <span style="font-size:9px;opacity:.55">@ ${gameTime}</span>`:'';
  return`<div class="wx-line"><span class="wx-ico">${wx.icon}</span><span>${parts.join(' · ')}${tl}</span></div>`;
}

function wxFull(homeAbbr,day){
  const park=PARKS[homeAbbr];
  if(!park||park.roof) return '🏟️ Dome — weather not a factor';
  const _td2=localDateStr(new Date());
  const _tm2=localDateStr(new Date(Date.now()+86400000));
  const wx=WEATHER[homeAbbr+':'+(day==='tomorrow'?_tm2:_td2)]||WEATHER[homeAbbr];
  if(!wx) return '⏳ Weather loading…';
  const parts=[`${wx.temp}°`,wx.cond];
  if(wx.wind>3) parts.push(`Wind ${wx.wind} mph${wx.windDir?' '+wx.windDir:''}`);
  parts.push(`${wx.precip}% precip`);
  return wx.icon+' '+parts.join(' · ');
}

function rerenderCards(){

}

/* ─────────────────────────────────────────────
   RENDER HELPERS
───────────────────────────────────────────── */
function rcls(r){
  if(!r) return 'lean';
  const l=r.toLowerCase();
  if(l.includes('elite'))    return 'elite';
  if(l.includes('strong'))   return 'strong';
  if(l.includes('moderate')) return 'moderate';
  return 'lean';
}
function rbadge(r){
  const c=rcls(r);
  const lbl={elite:'⭐⭐⭐ Elite',strong:'⭐⭐ Strong',moderate:'⭐ Moderate',lean:'📊 Lean'};
  return`<span class="rb rb-${c}">${lbl[c]}</span>`;
}
function ccls(c){
  if(!c) return 'c-low';
  const l=c.toLowerCase();
  if(l.includes('high')) return 'c-high';
  if(l.includes('med'))  return 'c-med';
  return 'c-low';
}
function clbl(c){
  if(!c) return '—';
  const l=c.toLowerCase();
  if(l.includes('high')) return '🟢 High';
  if(l.includes('med'))  return '🟡 Med';
  return '🔴 Low';
}
function trcls(t){
  if(!t) return 't-neut';
  if(t.includes('Hot')||t.includes('🔥')) return 't-hot';
  if(t.includes('Cold')||t.includes('❄')) return 't-cold';
  return 't-neut';
}
function gcls(g){
  if(!g) return '';
  const l=g.trim().toUpperCase().replace(/[^A-F]/g,'')[0];
  return l?`g-${l}`:'';
}
function sr(k,v){ return`<div class="sr"><span class="sk">${k}</span><span class="sv">${v}</span></div>`; }
function setMain(h){ document.getElementById('main').innerHTML=h; }

/* ─────────────────────────────────────────────

      <div class="matchup">
        <div class="team away"><div class="team-name">${sh(g.away)}</div><div class="team-rec">${g.awayRec}</div></div>
        <span class="at-sep">@</span>

        <div class="pitcher home-p"><div class="sp-name">${g.homeSP}${g.homeHand?` <span style="font-weight:400">(${g.homeHand==='L'?'LHP':'RHP'})</span>`:''}</div><div class="sp-stats">ERA ${g.homeERA} · WHIP ${g.homeWHIP}</div></div>

      <div class="divider"></div>
      <div class="winners">

          <div class="wb-team">${sh(g.f5Pick)}${g.ystF5Pick&&g.ystF5Pick!==g.f5Pick?`<span class="pick-changed">was ${sh(g.ystF5Pick)}</span>`:''}</div>
          ${g.awayF5pct&&g.homeF5pct?`<div style="font-size:9px;color:var(--text2);margin-top:2px">${g.f5Pick===g.away?g.awayF5pct:g.homeF5pct}% win prob</div>`:''}
        </div>
        <div class="wb wb-fg"><div class="wb-lbl">Full Game</div>
          <div class="wb-team">${sh(g.fgPick)}${g.ystFgPick&&g.ystFgPick!==g.fgPick?`<span class="pick-changed">was ${sh(g.ystFgPick)}</span>`:''}</div>

        </div>

        <div class="tot"><div class="tot-lbl">Game Total</div><div class="tot-val">${g.fgTotal}</div><div class="tot-sub ${ccls(g.fgConf)}">${clbl(g.fgConf)}</div></div>
      </div>
      <div class="run-box">
        <div class="run-box-lbl">Projected Runs</div>
        <div class="run-row">
          <div class="run-side away"><div class="run-tname">${sh(g.away)}</div><div class="run-nums away">F5: ${g.awayF5runs}</div><div class="run-nums away">FG: ${g.awayFGruns}</div></div>
          <div class="run-side home"><div class="run-tname">${sh(g.home)}</div><div class="run-nums home">F5: ${g.homeF5runs}</div><div class="run-nums home">FG: ${g.homeFGruns}</div></div>

  </div>`;

/* ─────────────────────────────────────────────
   RENDER TAB
───────────────────────────────────────────── */
function renderTab(tab){
  if(tab==='today'){
    if(!todayGames.length){setMain('<div class="status-wrap">No games found for today.</div>');return;}
    setMain(`<div class="games-grid">${todayGames.map((g,i)=>buildCard(g,i,'today')).join('')}</div>`);
  } else if(tab==='tomorrow'){
    if(!tmrwGames.length){setMain('<div class="status-wrap">No games found for tomorrow.</div>');return;}
    setMain(`<div class="games-grid">${tmrwGames.map((g,i)=>buildCard(g,i,'tomorrow')).join('')}</div>`);
  } else {
    renderStandings();
  }
}
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  if(!Object.keys(DATA).length) return;
  renderTab(tab);
}

/* ─────────────────────────────────────────────
   STANDINGS
───────────────────────────────────────────── */
const DIVS={
  'AL East':   ['New York Yankees','Boston Red Sox','Toronto Blue Jays','Baltimore Orioles','Tampa Bay Rays'],
  'AL Central':['Cleveland Guardians','Chicago White Sox','Kansas City Royals','Minnesota Twins','Detroit Tigers'],
  'AL West':   ['Houston Astros','Los Angeles Angels','Texas Rangers','Seattle Mariners','Athletics'],
  'NL East':   ['Atlanta Braves','Philadelphia Phillies','New York Mets','Miami Marlins','Washington Nationals'],
  'NL Central':['Milwaukee Brewers','Chicago Cubs','St. Louis Cardinals','Pittsburgh Pirates','Cincinnati Reds'],
  'NL West':   ['Los Angeles Dodgers','San Diego Padres','Arizona Diamondbacks','San Francisco Giants','Colorado Rockies'],
};
function renderStandings(){
  if(!DATA.teamStats?.length){setMain('<div class="status-wrap">Standings not loaded yet.</div>');return;}
  const tsMap={};
  for(const t of DATA.teamStats) if(t['Team']) tsMap[t['Team']]=t;

  let html='<div class="std-grid">';
  for(const [div,teams] of Object.entries(DIVS)){
    const isAL=div.startsWith('AL');
    const sorted=[...teams].sort((a,b)=>{
      const ta=tsMap[a]||{},tb=tsMap[b]||{};
      const wa=+(ta['W']||0),la=+(ta['L']||0),wb=+(tb['W']||0),lb=+(tb['L']||0);
      return(wb/(wb+lb||1))-(wa/(wa+la||1));
    });
    const ldr=tsMap[sorted[0]]||{};
    const lw=+(ldr['W']||0),ll=+(ldr['L']||0);
    html+=`<div class="div-card"><div class="div-hdr ${isAL?'al':'nl'}">${isAL?'🔵':'🔴'} ${div}</div>
    <table class="std-tbl"><thead><tr><th>Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th><th>L10</th><th>Str</th></tr></thead><tbody>`;
    sorted.forEach((tn,i)=>{
      const t=tsMap[tn]||{};
      const w=+(t['W']||0),l=+(t['L']||0);
      const pct=(w+l)?(w/(w+l)).toFixed(3).replace(/^0/,''):'.000';
      const gbVal=i===0?'—':(((lw-w)+(l-ll))/2).toFixed(1).replace('.0','');
      const a=abbr(tn);
      const f=DATA.advanced?.teamForm?.[a]||DATA.advanced?.teamForm?.[tn]||{};
      const l10w=f['L10 W']||'—', l10l=f['L10 L']||'—';
      const l10=(l10w!=='—'&&l10l!=='—')?`${l10w}-${l10l}`:'—';
      const streak=f['Streak']||'—';
      const snum=parseInt(streak.replace(/[WL]/,''))||0;
      const scls=streak.startsWith('W')?'sk-hot':(streak.startsWith('L')&&snum>=2?'sk-cold':'');
      html+=`<tr${i===0?' class="leader"':''}><td>${sh(tn)}</td><td>${w}</td><td>${l}</td><td>${pct}</td><td class="gb-d">${gbVal}</td><td>${l10}</td><td class="${scls}">${streak}</td></tr>`;
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  setMain(html);
}

function openModal(idx,day){
  const g=day==='today'?todayGames[idx]:tmrwGames[idx];

  const hSPF=DATA.advanced?.spForm?.[g.homeSP]||{};

  const hForm=DATA.advanced?.teamForm?.[g.homeAbbr]||DATA.advanced?.teamForm?.[g.home]||{};

  const h2h=h2hKey?DATA.advanced.h2h[h2hKey]:{};

  const hBPg=(g.hBP?.['Grade']||'').trim().charAt(0);

      <span style="color:var(--blue);font-weight:600">${sh(g.away)}</span>
      <span>Proj ${g.awayFGruns} – ${g.homeFGruns} runs</span>
      <span style="color:var(--green);font-weight:600">${sh(g.home)}</span>
    </div>
  </div>`;

  // Run totals
  h+=`<div class="run-detail">
    <div class="rd-lbl">Projected Run Totals</div>
    <div class="rd-grid">
      <div class="rdc"><div class="rdc-l">${sh(g.away)} F5</div><div class="rdc-v rdc-a">${g.awayF5runs}</div></div>
      <div class="rdc"><div class="rdc-l">${sh(g.away)} FG</div><div class="rdc-v rdc-a">${g.awayFGruns}</div></div>
      <div class="rdc"><div class="rdc-l">${sh(g.home)} F5</div><div class="rdc-v rdc-h">${g.homeF5runs}</div></div>

      <div class="rd-totcell"><div class="rdtc-l">F5 Total</div><div class="rdtc-v">${g.f5Total} <span style="font-size:10px" class="${ccls(g.f5Conf)}">${clbl(g.f5Conf)}</span></div></div>

    </div>
  </div>`;

  // Park + weather
  h+=`<div class="wx-detail-box">

      ${sr('Overall',g.awayRec||'—')}
      ${sr('Home',g.awayHomeRec||'—')} ${sr('Away',g.awayAwayRec||'—')}
      ${sr('ERA',g.aTS?.['ERA']||g.aTS?.['Team ERA']||'—')}
      ${sr('OPS',g.aTS?.['OPS']||'—')}

  document.getElementById('modal-body').innerHTML=h;

}
