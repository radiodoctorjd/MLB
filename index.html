<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLB Prediction Model</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap');
  :root {
    --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235; --border:#1e2d45;
    --accent:#2563eb; --green:#16a34a; --red:#dc2626; --text:#f1f5f9;
    --text2:#94a3b8; --text3:#64748b;
    --elite:#f59e0b; --strong:#60a5fa; --moderate:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}

  header{background:linear-gradient(135deg,#0f172a,#1e3a5f);border-bottom:1px solid var(--border);
    padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:100}
  .logo{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:1px}
  .logo span{color:var(--accent)}
  .live-badge{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#16a34a;letter-spacing:1px}
  .live-dot{width:7px;height:7px;background:#16a34a;border-radius:50%;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
  .refresh-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 12px;
    border-radius:6px;cursor:pointer;font-size:13px;font-family:'Barlow',sans-serif;transition:all .2s}
  .refresh-btn:hover{border-color:var(--accent);color:var(--text)}

  .controls{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tab-group,.filter-group{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px}
  .tab-btn,.filter-btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;
    font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;transition:all .2s;
    background:none;color:var(--text2)}
  .tab-btn.active{background:var(--accent);color:white}
  .filter-btn.active{background:var(--surface2);color:var(--text)}
  .tab-btn:hover:not(.active),.filter-btn:hover:not(.active){color:var(--text)}
  .sort-group{display:flex;gap:4px;margin-left:auto}
  .sort-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);cursor:pointer;
    font-family:'Barlow',sans-serif;font-size:12px;font-weight:500;background:none;color:var(--text3);transition:all .2s}
  .sort-btn.active{border-color:var(--accent);color:var(--text)}

  #status-bar{padding:8px 20px;font-size:12px;color:var(--text3);background:var(--bg);
    border-bottom:1px solid var(--border);display:none}
  #status-bar.visible{display:block}
  #status-bar.error{color:#f87171}

  .game-count{padding:10px 20px 4px;font-size:12px;color:var(--text3);font-weight:600;
    letter-spacing:.5px;text-transform:uppercase}

  #games-grid{padding:8px 16px 40px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}

  .game-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    overflow:hidden;transition:transform .15s,border-color .15s}
  .game-card:hover{transform:translateY(-2px);border-color:#2e4a6e}

  .card-header{padding:12px 14px 10px;display:flex;align-items:center;
    justify-content:space-between;border-bottom:1px solid var(--border)}
  .matchup{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;line-height:1.2}
  .matchup .at{color:var(--text3);font-weight:400;margin:0 4px}
  .matchup .winner{color:#60a5fa}
  .card-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .rating-badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .rating-elite{background:rgba(245,158,11,.15);color:var(--elite);border:1px solid rgba(245,158,11,.3)}
  .rating-strong{background:rgba(96,165,250,.15);color:var(--strong);border:1px solid rgba(96,165,250,.3)}
  .rating-moderate{background:rgba(167,139,250,.15);color:var(--moderate);border:1px solid rgba(167,139,250,.3)}
  .rating-lean{background:rgba(148,163,184,.1);color:var(--text3);border:1px solid var(--border)}
  .game-time{font-size:11px;color:var(--text3);font-weight:500}

  .pitchers-row{padding:8px 14px;display:flex;gap:8px;align-items:center;
    border-bottom:1px solid var(--border);flex-wrap:wrap}
  .pitcher-chip{font-size:11px;padding:3px 8px;background:var(--surface2);border-radius:4px;
    color:var(--text2);display:flex;align-items:center;gap:4px}
  .pitcher-chip .era{color:var(--text3);font-size:10px}
  .pitcher-chip .lbl{color:var(--text3);font-size:10px;font-weight:600;text-transform:uppercase}
  .pitcher-vs{color:var(--text3);font-size:11px}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr}
  .stat-panel{padding:10px 14px;border-bottom:1px solid var(--border)}
  .stat-panel:nth-child(1){border-right:1px solid var(--border)}
  .stat-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    color:var(--text3);margin-bottom:5px}
  .stat-pick{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
    color:#60a5fa;margin-bottom:4px;line-height:1.1}
  .stat-nums{display:flex;gap:10px;margin-bottom:4px}
  .stat-num{display:flex;flex-direction:column;align-items:center}
  .stat-num .val{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:var(--text)}
  .stat-num .lbl{font-size:9px;font-weight:600;letter-spacing:.5px;color:var(--text3);text-transform:uppercase}
  .conf-badge{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600}
  .conf-high{background:rgba(22,163,74,.15);color:#4ade80}
  .conf-med{background:rgba(234,179,8,.15);color:#fbbf24}
  .conf-low{background:rgba(148,163,184,.1);color:var(--text3)}

  .win-row{display:flex;align-items:center;gap:6px;margin-top:3px}
  .win-lbl{font-size:10px;color:var(--text3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .win-bar{width:80px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;flex-shrink:0}
  .win-fill{height:100%;border-radius:2px}
  .fill-high{background:#16a34a}
  .fill-mid{background:var(--accent)}
  .fill-low{background:var(--red)}
  .win-pct{font-size:10px;color:var(--text2);width:36px;text-align:right;flex-shrink:0}

  .venue-row{padding:7px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    border-bottom:1px solid var(--border)}
  .park-badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:600}
  .park-hitter{background:rgba(239,68,68,.12);color:#f87171}
  .park-pitcher{background:rgba(34,197,94,.12);color:#4ade80}
  .park-neutral{background:rgba(148,163,184,.1);color:var(--text3)}

  #empty-state{display:none;text-align:center;padding:80px 20px;color:var(--text3)}
  #empty-state.visible{display:block}
  #empty-state .emoji{font-size:48px;margin-bottom:16px}
  #empty-state h3{font-size:18px;color:var(--text2);margin-bottom:8px}

  #loading{display:none;text-align:center;padding:60px 20px;color:var(--text3)}
  #loading.visible{display:block}
  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}

  #debug-panel{background:#111827;border:1px solid #1e2d45;border-radius:8px;
    margin:12px 16px;padding:12px;font-size:11px;font-family:monospace;color:#94a3b8;
    display:none;max-height:200px;overflow-y:auto}

  @media(max-width:600px){
    #games-grid{grid-template-columns:1fr;padding:8px 10px 40px}
    .controls{padding:10px 12px}
    .sort-group{margin-left:0}
  }
</style>
</head>
<body>

<header>
  <div class="logo">⚾ MLB <span>PREDICTIONS</span></div>
  <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  <button class="refresh-btn" onclick="loadData()">↻ REFRESH</button>
</header>

<div class="controls">
  <div class="tab-group">
    <button class="tab-btn active" id="tab-today" onclick="setDay('today')">Today</button>
    <button class="tab-btn" id="tab-tomorrow" onclick="setDay('tomorrow')">Tomorrow</button>
  </div>
  <div class="filter-group">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('elite',this)">⭐⭐⭐ Elite</button>
    <button class="filter-btn" onclick="setFilter('strong',this)">⭐⭐ Strong</button>
    <button class="filter-btn" onclick="setFilter('moderate',this)">⭐ Moderate</button>
  </div>
  <div class="sort-group">
    <button class="sort-btn active" onclick="setSort('time',this)">Time</button>
    <button class="sort-btn" onclick="setSort('conf',this)">Confidence</button>
    <button class="sort-btn" onclick="setSort('total',this)">FG Total ↓</button>
  </div>
</div>

<div id="status-bar"></div>
<div id="debug-panel"></div>
<div class="game-count" id="game-count"></div>
<div id="loading" class="visible"><div class="spinner"></div>Loading from Google Sheets...</div>
<div id="games-grid"></div>
<div id="empty-state"><div class="emoji">🔍</div><h3>No games match this filter</h3><p>Try a different rating or day</p></div>

<script>
const SHEET_ID = "1D1sOPDBV4WAT6W_8jabZRjr3UdKp3sIC8qk9dbZ4NjE";
const GID      = "596859801";

let ALL_GAMES = [];
let currentDay    = 'today';
let currentFilter = 'all';
let currentSort   = 'time';
let debugLog      = [];

function log(msg) {
  debugLog.push(msg);
  console.log(msg);
}

// ── Google Visualization Query API (no CORS issues) ──────────────────────
// Returns JSON with a DataTable — works from any domain on published sheets
function loadVizData() {
  return new Promise((resolve, reject) => {
    const cb = 'mlbCB_' + Date.now();
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&tq=select%20*&gid=${GID}&cb=${cb}`;

    window[cb] = function(data) {
      delete window[cb];
      document.getElementById('vizScript')?.remove();
      resolve(data);
    };

    const script = document.createElement('script');
    script.id = 'vizScript';
    script.src = url;
    script.onerror = () => { delete window[cb]; reject(new Error('Script load failed')); };
    document.head.appendChild(script);
  });
}

// ── Parse Google Visualization DataTable into rows of strings ────────────
function vizToRows(data) {
  const table = data.table;
  if (!table || !table.rows) return [];

  // Column labels
  const cols = table.cols.map(c => (c.label || '').trim());
  log('Columns (' + cols.length + '): ' + cols.map((c,i) => i+':'+JSON.stringify(c)).join(' | '));

  const rows = [];
  for (const row of table.rows) {
    if (!row.c) continue;
    const cells = row.c.map(cell => {
      if (!cell) return '';
      // Use formatted value if available, else raw value
      const v = cell.f !== undefined && cell.f !== null ? String(cell.f)
              : cell.v !== undefined && cell.v !== null ? String(cell.v)
              : '';
      return v.trim();
    });
    rows.push(cells);
  }
  return { cols, rows };
}

// ── Find the predictions table and map columns ───────────────────────────
function findColMap(cols) {
  const map = {};
  cols.forEach((c, i) => {
    const s = c.toLowerCase().replace(/[^a-z0-9%\/@]/g,' ').replace(/\s+/g,' ').trim();
    log(`  col[${i}] = "${c}" → normalized: "${s}"`);

    if (s === 'matchup' || s.includes('matchup'))           map.matchup  = i;
    else if (s === 'time' || s === 'time et' || s.includes('time')) map.time = i;
    else if (s.includes('away sp'))                          map.awaySP   = i;
    else if (s.includes('home sp'))                          map.homeSP   = i;
    else if (s.includes('park factor') || s === 'park')     map.park     = i;
    else if (s.includes('wx') || s.includes('weather'))     map.wx       = i;
    // Win% columns — order matters: first away/home pair = F5, second = FG
    else if (/away.*win|away.*%/.test(s) && map.awayF5 === undefined) map.awayF5 = i;
    else if (/home.*win|home.*%/.test(s) && map.homeF5 === undefined) map.homeF5 = i;
    else if (/away.*win|away.*%/.test(s) && map.awayFG === undefined) map.awayFG = i;
    else if (/home.*win|home.*%/.test(s) && map.homeFG === undefined) map.homeFG = i;
    // Pick columns
    else if (/f5.*pick|f5pick/.test(s))                     map.f5Pick   = i;
    else if (/fg.*pick|fgpick/.test(s))                     map.fgPick   = i;
    // Conf columns
    else if (/f5.*conf/.test(s))                            map.f5Conf   = i;
    else if (/fg.*conf/.test(s))                            map.fgConf   = i;
    // Total columns
    else if (/f5.*total/.test(s))                           map.f5Total  = i;
    else if (/fg.*total|proj.*total|total/.test(s) && map.fgTotal === undefined) map.fgTotal = i;
    // O/U
    else if (/f5.*o.u/.test(s))                             map.f5OU     = i;
    else if (/fg.*o.u|o.u/.test(s) && map.fgOU === undefined) map.fgOU  = i;
    // Rating
    else if (s === 'rating' || s.includes('rating') || s.includes('⭐')) map.rating = i;
  });
  log('colMap: ' + JSON.stringify(map));
  return map;
}

// ── Parse rows into game objects ─────────────────────────────────────────
function parseGames(cols, rows) {
  const map = findColMap(cols);
  const games = [];
  let currentDay = 'today';

  const get = (row, key) => (map[key] !== undefined && row[map[key]] !== undefined)
                           ? row[map[key]] : '';

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const flat = row.join(' ');

    // Day markers
    if (/today/i.test(flat) && !/@/.test(flat))     { currentDay = 'today';    continue; }
    if (/tmrw|tomorrow/i.test(flat) && !/@/.test(flat)) { currentDay = 'tomorrow'; continue; }

    // Must have @ for game rows
    const matchupRaw = map.matchup !== undefined ? row[map.matchup]
                     : row.find(c => / @ /i.test(c)) || '';
    if (!/ @ /i.test(matchupRaw)) continue;

    const parts = matchupRaw.split('@').map(s => s.trim());
    if (parts.length < 2 || !parts[0] || !parts[1]) continue;

    const away = parts[0];
    const home = parts[1];

    // Parse SP: "Name (ERA)" format
    const spParse = raw => {
      const m = raw.match(/^(.+?)\s*\(([\d.]+|—|--)\)\s*$/);
      return m ? { name: m[1].trim(), era: m[2] }
               : { name: raw.replace(/\(.*\)/g,'').trim(), era: '' };
    };

    const awaySPInfo = spParse(get(row, 'awaySP'));
    const homeSPInfo = spParse(get(row, 'homeSP'));

    const g = {
      day:      currentDay,
      time:     get(row, 'time'),
      away, home,
      awaySP:   awaySPInfo.name,
      awaySPERA: awaySPInfo.era,
      homeSP:   homeSPInfo.name,
      homeSPERA: homeSPInfo.era,
      park:     get(row, 'park'),
      wx:       get(row, 'wx'),
      awayF5:   get(row, 'awayF5'),
      homeF5:   get(row, 'homeF5'),
      f5Pick:   get(row, 'f5Pick'),
      f5Conf:   get(row, 'f5Conf'),
      f5Total:  get(row, 'f5Total'),
      f5OU:     get(row, 'f5OU'),
      awayFG:   get(row, 'awayFG'),
      homeFG:   get(row, 'homeFG'),
      fgPick:   get(row, 'fgPick'),
      fgConf:   get(row, 'fgConf'),
      fgTotal:  get(row, 'fgTotal'),
      fgOU:     get(row, 'fgOU'),
      rating:   get(row, 'rating'),
    };

    // Fallback: derive pick from win%
    if (!g.fgPick && g.awayFG && g.homeFG) {
      g.fgPick = parseFloat(g.awayFG) > parseFloat(g.homeFG) ? away : home;
    }
    if (!g.f5Pick && g.awayF5 && g.homeF5) {
      g.f5Pick = parseFloat(g.awayF5) > parseFloat(g.homeF5) ? away : home;
    }

    log(`Game: ${away} @ ${home} | day=${currentDay} | fgPick=${g.fgPick} | rating=${g.rating}`);
    games.push(g);
  }
  return games;
}

// ── Main load ─────────────────────────────────────────────────────────────
async function loadData() {
  debugLog = [];
  setStatus('Loading from Google Sheets...', false);
  document.getElementById('loading').style.display = 'block';
  document.getElementById('games-grid').innerHTML = '';
  document.getElementById('empty-state').style.display = 'none';
  ALL_GAMES = [];

  try {
    log('Fetching via Google Visualization API...');
    const data = await loadVizData();
    const { cols, rows } = vizToRows(data);
    log(`Got ${rows.length} data rows, ${cols.length} columns`);

    ALL_GAMES = parseGames(cols, rows);
    log(`Parsed ${ALL_GAMES.length} games`);

    document.getElementById('loading').style.display = 'none';

    // Show debug panel (can be hidden after confirming it works)
    const dp = document.getElementById('debug-panel');
    dp.style.display = 'block';
    dp.textContent = debugLog.join('\n');

    if (ALL_GAMES.length === 0) {
      setStatus('⚠️ Sheet loaded but no games found — check debug panel below', true);
    } else {
      const td = ALL_GAMES.filter(g => g.day === 'today').length;
      const tm = ALL_GAMES.filter(g => g.day === 'tomorrow').length;
      setStatus(`✅ Loaded ${ALL_GAMES.length} games (Today: ${td}, Tomorrow: ${tm})`, false);
      document.getElementById('tab-today').textContent    = `Today (${td})`;
      document.getElementById('tab-tomorrow').textContent = `Tomorrow (${tm})`;
    }
  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    log('ERROR: ' + e.message);
    const dp = document.getElementById('debug-panel');
    dp.style.display = 'block';
    dp.textContent = debugLog.join('\n');
    setStatus('❌ Failed to load: ' + e.message, true);
  }

  render();
}

// ── UI Helpers ────────────────────────────────────────────────────────────
function setStatus(msg, isErr) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
  el.className = isErr ? 'visible error' : 'visible';
}
function setDay(d) {
  currentDay = d;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + d).classList.add('active');
  render();
}
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function setSort(s, btn) {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// ── Card rendering ────────────────────────────────────────────────────────
function ratingKey(r) {
  if (/elite|⭐⭐⭐/.test(r))    return 'elite';
  if (/strong|⭐⭐/.test(r))     return 'strong';
  if (/moderate|⭐/.test(r))    return 'moderate';
  return 'lean';
}
function confCls(c) {
  if (/high/i.test(c)) return 'conf-high';
  if (/med/i.test(c))  return 'conf-med';
  return 'conf-low';
}
function confLabel(c) {
  if (!c) return '';
  if (/high/i.test(c)) return '🟢 High';
  if (/med/i.test(c))  return '🟡 Med';
  if (/low/i.test(c))  return '🔴 Low';
  return c;
}
function fillCls(pct) {
  const v = parseFloat(pct);
  if (v >= 58) return 'fill-high';
  if (v <= 42) return 'fill-low';
  return 'fill-mid';
}
function parkCls(pf) {
  const v = parseFloat(pf);
  if (v > 1.03) return 'park-hitter';
  if (v < 0.97) return 'park-pitcher';
  return 'park-neutral';
}
function parkLbl(pf) {
  const v = parseFloat(pf);
  if (!v) return `Park Factor: ${pf}`;
  if (v >= 1.30) return `🔴 Extreme Hitter (${pf})`;
  if (v >= 1.05) return `🟠 Hitter Friendly (${pf})`;
  if (v <= 0.94) return `🟢 Pitcher Friendly (${pf})`;
  return `⚪ Neutral Park (${pf})`;
}
function ratingBadge(r) {
  const k = ratingKey(r);
  const lbl = {elite:'⭐⭐⭐ Elite', strong:'⭐⭐ Strong', moderate:'⭐ Moderate', lean:'📊 Lean'}[k];
  return `<span class="rating-badge rating-${k}">${lbl}</span>`;
}
function winBar(pct, label) {
  if (!pct) return '';
  const v = Math.min(Math.max(parseFloat(pct)||50, 0), 100);
  const display = pct.includes('%') ? pct : v.toFixed(1) + '%';
  return `<div class="win-row">
    <span class="win-lbl">${label}</span>
    <div class="win-bar"><div class="win-fill ${fillCls(v)}" style="width:${v}%"></div></div>
    <span class="win-pct">${display}</span>
  </div>`;
}

function gameCard(g) {
  const awayFGv = parseFloat(g.awayFG) || 0;
  const homeFGv = parseFloat(g.homeFG) || 0;
  const awayWinner = awayFGv > homeFGv;
  const awayCls = awayWinner ? ' winner' : '';
  const homeCls = awayWinner ? '' : ' winner';

  const spChip = (lbl, name, era) => {
    const nameStr = name || 'TBD';
    const eraStr  = era  ? ` <span class="era">(${era})</span>` : '';
    return `<div class="pitcher-chip"><span class="lbl">${lbl}</span> ${nameStr}${eraStr}</div>`;
  };

  return `<div class="game-card">
    <div class="card-header">
      <div class="matchup">
        <span class="${awayCls.trim()}">${g.away}</span>
        <span class="at">@</span>
        <span class="${homeCls.trim()}">${g.home}</span>
      </div>
      <div class="card-meta">
        ${ratingBadge(g.rating)}
        ${g.time ? `<span class="game-time">${g.time}</span>` : ''}
      </div>
    </div>

    <div class="pitchers-row">
      ${spChip('Away', g.awaySP, g.awaySPERA)}
      <span class="pitcher-vs">vs</span>
      ${spChip('Home', g.homeSP, g.homeSPERA)}
    </div>

    <div class="stats-grid">
      <div class="stat-panel">
        <div class="stat-label">⚡ First 5 Innings</div>
        ${g.f5Pick ? `<div class="stat-pick">${g.f5Pick}</div>` : ''}
        <div class="stat-nums">
          ${g.f5Total ? `<div class="stat-num"><span class="val">${g.f5Total}</span><span class="lbl">F5 Total</span></div>` : ''}
          ${g.f5OU    ? `<div class="stat-num"><span class="val">${g.f5OU}</span><span class="lbl">O/U</span></div>` : ''}
          ${g.f5Conf  ? `<div class="stat-num"><span class="conf-badge ${confCls(g.f5Conf)}">${confLabel(g.f5Conf)}</span><span class="lbl">Conf</span></div>` : ''}
        </div>
        ${winBar(g.awayF5, g.away)}
        ${winBar(g.homeF5, g.home)}
      </div>
      <div class="stat-panel">
        <div class="stat-label">🏆 Full Game</div>
        ${g.fgPick ? `<div class="stat-pick">${g.fgPick}</div>` : ''}
        <div class="stat-nums">
          ${g.fgTotal ? `<div class="stat-num"><span class="val">${g.fgTotal}</span><span class="lbl">FG Total</span></div>` : ''}
          ${g.fgOU    ? `<div class="stat-num"><span class="val">${g.fgOU}</span><span class="lbl">O/U</span></div>` : ''}
          ${g.fgConf  ? `<div class="stat-num"><span class="conf-badge ${confCls(g.fgConf)}">${confLabel(g.fgConf)}</span><span class="lbl">Conf</span></div>` : ''}
        </div>
        ${winBar(g.awayFG, g.away)}
        ${winBar(g.homeFG, g.home)}
      </div>
    </div>

    ${(g.park || g.wx) ? `<div class="venue-row">
      ${g.park ? `<span class="park-badge ${parkCls(g.park)}">${parkLbl(g.park)}</span>` : ''}
      ${g.wx && g.wx !== '0%' && g.wx !== '+0%' ? `<span style="font-size:10px;color:var(--text3)">Wx Adj: ${g.wx}</span>` : ''}
    </div>` : ''}
  </div>`;
}

function render() {
  let games = ALL_GAMES.filter(g => g.day === currentDay);
  if (currentFilter !== 'all') games = games.filter(g => ratingKey(g.rating) === currentFilter);
  if (currentSort === 'conf') {
    const rank = {elite:0,strong:1,moderate:2,lean:3};
    games.sort((a,b) => (rank[ratingKey(a.rating)]||3) - (rank[ratingKey(b.rating)]||3));
  } else if (currentSort === 'total') {
    games.sort((a,b) => (parseFloat(b.fgTotal)||0) - (parseFloat(a.fgTotal)||0));
  }

  const grid  = document.getElementById('games-grid');
  const empty = document.getElementById('empty-state');
  const count = document.getElementById('game-count');

  if (games.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    count.textContent = '';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = games.map(gameCard).join('');
    count.textContent = `${games.length} game${games.length !== 1 ? 's' : ''}`;
  }
}

loadData();
</script>
</body>
</html>
