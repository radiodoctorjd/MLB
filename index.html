/* Convert met. wind direction (where wind comes FROM) to field-relative description */
function windToField(windFromDeg, parkHomeDir) {
  // windFromDeg = direction wind is coming FROM (meteorological)
  // parkHomeDir = bearing FROM CF toward home plate
  // We want to say wind is blowing "in/out" and toward which field zone
  const cfDir = (parkHomeDir + 180) % 360; // bearing from home plate toward CF
  // angle of wind blowing toward, relative to CF direction
  const windToDeg = (windFromDeg + 180) % 360;
  let diff = ((windToDeg - cfDir) % 360 + 360) % 360;

  // In vs out
  let inOut;
  if (diff > 315 || diff <= 45)  inOut = 'out';
  else if (diff > 135 && diff <= 225) inOut = 'in';
  else inOut = 'across';

  // Field zone
  let zone;
  if (diff > 315 || diff <= 45)  zone = 'to center';
  else if (diff > 45 && diff <= 90)  zone = 'out to right-center';
  else if (diff > 90 && diff <= 135) zone = 'out to right';
  else if (diff > 135 && diff <= 180) zone = 'in from right';
  else if (diff > 180 && diff <= 225) zone = 'in from left';
  else if (diff > 225 && diff <= 270) zone = 'out to left';
  else zone = 'out to left-center';

  if (inOut === 'across') {
    zone = diff > 45 && diff <= 135 ? 'blowing right to left' : 'blowing left to right';
  }
  return zone;
}

async function fetchCSV(gid){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status} fetching gid=${gid}`);
  return parseCSV(await r.text());
}
function parseCSV(txt){
  return txt.split('\n').map(line=>{
    const out=[];let cur='',inQ=false;
    for(const c of line){
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){out.push(cur.trim());cur='';}
      else cur+=c;
    }
    out.push(cur.trim());
    return out;
  }).filter(r=>r.some(c=>c));
}

    const f=(rows[i][0]||'');
    // Skip emoji-prefixed title rows
    if(/[\u{1F300}-\u{1FFFF}]/u.test(f)||f.startsWith('📅')||f.startsWith('📊')||f.startsWith('⚾')||f.startsWith('🔥')||f.startsWith('🏟')||f.startsWith('📈')||f.startsWith('🎰')) continue;
    // Skip fully empty rows
    if(rows[i].every(c=>!c)) continue;
    // Skip section-header rows — rows where only the first cell has content (like "SECTION 1 — ...")
    const nonEmpty = rows[i].filter(c=>c.trim());
    if(nonEmpty.length < 2) continue;
    hi=i; break;
  }
  const headers=rows[hi].map(h=>h.replace(/[^\w\s/%().⭐🔥❄️➡📈📉-]/g,'').trim());
  return rows.slice(hi+1).filter(r=>r.some(c=>c)).map(row=>{
    const o={};
    headers.forEach((h,i)=>{o[h]=(row[i]||'').trim();});
    return o;
  });
}

/* ─────────────────────────────────────────────
   PROCESS SCHEDULE
───────────────────────────────────────────── */
function processSchedule(rows){
  const all=[];let section=null;
  for(const row of rows){
    const f=(row[0]||'').trim();
    if(f.includes('TODAY')){section='today';continue;}
    if(f.includes('TOMORROW')){section='tomorrow';continue;}
    if(!f||f.includes('Time')||f.startsWith('📅')) continue;
    if(section&&row[0]&&row[2]) all.push({_day:section,raw:row});
  }
  return all;
}

/* ─────────────────────────────────────────────
   PROCESS ADVANCED (multi-section sheet)
───────────────────────────────────────────── */
function processAdvanced(rows){
  const res={spForm:{},teamForm:{},h2h:{}};
  let section=null,headers=[];
  for(const row of rows){
    const f=(row[0]||'').trim();
    if(f.includes('SECTION 1')||f.includes('STARTING PITCHER')){section='sp';headers=[];continue;}
    if(f.includes('SECTION 2')||f.includes('TEAM FORM')){section='team';headers=[];continue;}
    if(f.includes('SECTION 3')||f.includes('HEAD-TO-HEAD')){section='h2h';headers=[];continue;}
    if(!f||row.every(c=>!c)) continue;
    const fl=f.toLowerCase();
    if(fl==='pitcher'||fl==='team'||fl==='matchup'){headers=row.map(h=>h.trim());continue;}
    if(!headers.length) continue;
    const obj={};headers.forEach((h,i)=>{obj[h]=(row[i]||'').trim();});
    if(section==='sp'  &&obj['Pitcher']) res.spForm[obj['Pitcher']]=obj;
    if(section==='team'&&obj['Abbr'])    res.teamForm[obj['Abbr']]=obj;
    if(section==='team'&&obj['Team']&&!obj['Abbr']) res.teamForm[obj['Team']]=obj;
    if(section==='h2h' &&obj['Matchup']) res.h2h[obj['Matchup']]=obj;
  }
  return res;
}

/* ─────────────────────────────────────────────
   BUILD GAME OBJECTS
───────────────────────────────────────────── */
function buildGames(){
  todayGames=[];tmrwGames=[];
  for(const entry of DATA.schedule){
    const r=entry.raw;
    // cols: Time, Day, Away, (vs), Home, Venue, AwaysSP, AwayERA, AwayWHIP, HomeSP, HomeERA, HomeWHIP ...
    const [time,,awayTeam,,homeTeam,venue,awaySP,awayERA,awayWHIP,homeSP,homeERA,homeWHIP]=r;
    if(!awayTeam||!homeTeam) continue;
    const awayAbbr=abbr(awayTeam), homeAbbr=abbr(homeTeam);

    const pred = DATA.predictions.find(p=>rowMatch(p,awayTeam,homeTeam));
    const tot  = DATA.totals.find(t=>rowMatch(t,awayTeam,homeTeam));
    const aTS  = DATA.teamStats.find(t=>t['Team']===awayTeam||t['Abbr']===awayAbbr)||{};
    const hTS  = DATA.teamStats.find(t=>t['Team']===homeTeam||t['Abbr']===homeAbbr)||{};
    const pk   = DATA.parkWx.find(p=>p['Team']===homeTeam)||{};
    const aBP  = DATA.bullpen.find(b=>b['Team']===awayTeam)||{};
    const hBP  = DATA.bullpen.find(b=>b['Team']===homeTeam)||{};
    const aPit = DATA.pitchers.find(p=>p['Pitcher']===awaySP)||{};
    const hPit = DATA.pitchers.find(p=>p['Pitcher']===homeSP)||{};

    const g={
      time, away:awayTeam, home:homeTeam,
      venue: venue||pk['Stadium']||'',
      awayAbbr, homeAbbr,
      awaySP:awaySP||'TBD', awayERA:awayERA||'—', awayWHIP:awayWHIP||'—',
      homeSP:homeSP||'TBD', homeERA:homeERA||'—', homeWHIP:homeWHIP||'—',
      f5Pick:  col(pred,'F5 Pick')||'—',
      f5Conf:  col(pred,'F5 Conf')||'—',
      f5Total: col(pred,'F5 Total')||col(tot,'F5 Tot')||'—',
      fgPick:  col(pred,'FG Pick')||'—',
      fgConf:  col(pred,'FG Conf')||'—',
      fgTotal: col(pred,'FG Total')||col(tot,'FG Tot')||'—',
      rating:  col(pred,'Rating')||'—',
      awayF5pct: pf(col(pred,'Away F5%')),
      homeF5pct: pf(col(pred,'Home F5%')),
      awayFGpct: pf(col(pred,'Away FG%')),
      homeFGpct: pf(col(pred,'Home FG%')),
      // team run totals — try multiple column name variants
      awayF5runs: col(tot,'Away F5')||'—',
      homeF5runs: col(tot,'Home F5')||'—',
      awayFGruns: col(tot,'Away FG')||'—',
      homeFGruns: col(tot,'Home FG')||'—',
      awayRec: aTS['W']&&aTS['L']?`${aTS['W']}-${aTS['L']}`:'',
      homeRec: hTS['W']&&hTS['L']?`${hTS['W']}-${hTS['L']}`:'',
      aTS,hTS,aBP,hBP,aPit,hPit,
      park: pk['Stadium']||venue||'',
      parkFactor: pk['Park Factor']||'—',
      roof: pk['Roof']||'',
      altitude: pk['Alt (ft)']||'',
    };
    if(entry._day==='today')     todayGames.push(g);
    else if(entry._day==='tomorrow') tmrwGames.push(g);
  }
}

/* helpers */
function col(obj,...keys){
  if(!obj) return '';
  for(const k of keys){
    const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
    const nk=norm(k);
    const found=Object.keys(obj).find(ok=>norm(ok).includes(nk)||nk.includes(norm(ok)));
    if(found&&obj[found]) return obj[found];
  }
  return '';
}
function rowMatch(row,away,home){
  const m=Object.values(row).join(' ').toLowerCase();
  return m.includes(away.split(' ').pop().toLowerCase())&&m.includes(home.split(' ').pop().toLowerCase());
}
function pf(s){ return s?parseFloat(s.replace('%',''))||null:null; }
// Clean K/9 values that Google Sheets may export as percentage-formatted decimals (e.g. "959.00%" → "9.59")
function cleanK9(s){
  if(!s||s==='—') return '—';
  // If value ends with % and is large (>20), it's a decimal stored as percent: divide by 100
  const m=s.match(/^([\d.]+)%$/);
  if(m){ const v=parseFloat(m[1]); return v>20?(v/100).toFixed(2):s; }
  return s;
}

/* ─────────────────────────────────────────────
   OPEN-METEO WEATHER (CORS-safe, no key)
───────────────────────────────────────────── */
async function fetchWeatherAll(){
  // Collect unique home parks from today + tomorrow
  const homes=new Set([...todayGames,...tmrwGames].map(g=>g.homeAbbr));
  const toFetch=[...homes].filter(a=>PARKS[a]&&!PARKS[a].roof);

  if(!toFetch.length){ rerenderCards(); return; }

  // Batch: Open-Meteo supports multiple lat/lon in one call (pipe-separated)
  const lats=toFetch.map(a=>PARKS[a].lat).join(',');
  const lons=toFetch.map(a=>PARKS[a].lon).join(',');
  const url=`https://api.open-meteo.com/v1/forecast`+
    `?latitude=${lats}&longitude=${lons}`+
    `&current=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m`+
    `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=1`;

  try{
    const resp=await fetch(url);
    if(!resp.ok) throw new Error(`Open-Meteo ${resp.status}`);
    const json=await resp.json();

    // Response is array when multiple locations, single object when one
    const results=Array.isArray(json)?json:[json];

    results.forEach((loc,i)=>{
      const a=toFetch[i];
      if(!loc||!loc.current) return;
      const c=loc.current;
      const code=c.weather_code??c.weathercode??0;
      const windDeg=c.wind_direction_10m??c.winddirection??0;
      const windSpd=c.wind_speed_10m??c.windspeed??0;
      const park=PARKS[a];
      const windZone=windSpd>3?windToField(windDeg,park.homeDir):null;
      WEATHER[a]={
        temp: Math.round(c.temperature_2m??c.temperature??0),
        code,
        cond: WX_CODE[code]||'Clear',
        icon: WX_ICON[code]||'🌤️',
        wind: Math.round(windSpd),
        windDir: windZone,
        precip: Math.round(c.precipitation_probability??0),
      };
    });
    rerenderCards();
  }catch(e){
    console.warn('Open-Meteo weather failed:',e);
    // leave WEATHER empty — cards show "unavailable"
  }
}

function wxLine(homeAbbr){
  const park=PARKS[homeAbbr];
  if(!park||park.roof){
    return`<div class="wx-line"><span class="wx-ico">🏟️</span><span>Dome — weather not a factor</span></div>`;
  }
  const wx=WEATHER[homeAbbr];
  if(!wx){
    return`<div class="wx-line"><span class="wx-ico" style="opacity:.4">⏳</span><span style="opacity:.5">Loading weather…</span></div>`;
  }
  const parts=[`${wx.temp}°`,wx.cond];
  if(wx.wind>3) parts.push(`Wind ${wx.wind} mph${wx.windDir?' '+wx.windDir:''}`);
  parts.push(`${wx.precip}% precip`);
  return`<div class="wx-line"><span class="wx-ico">${wx.icon}</span><span>${parts.join(' · ')}</span></div>`;
}

function wxFull(homeAbbr){
  const park=PARKS[homeAbbr];
  if(!park||park.roof) return '🏟️ Dome — weather not a factor';
  const wx=WEATHER[homeAbbr];
  if(!wx) return '⏳ Weather loading…';
  const parts=[`${wx.temp}°`,wx.cond];
  if(wx.wind>3) parts.push(`Wind ${wx.wind} mph${wx.windDir?' '+wx.windDir:''}`);
  parts.push(`${wx.precip}% precip`);
  return wx.icon+' '+parts.join(' · ');
}

function rcls(r){
  if(!r) return 'lean';
  const l=r.toLowerCase();
  if(l.includes('elite'))    return 'elite';
  if(l.includes('strong'))   return 'strong';
  if(l.includes('moderate')) return 'moderate';
  return 'lean';
}
function rbadge(r){
  const c=rcls(r);
  const lbl={elite:'⭐⭐⭐ Elite',strong:'⭐⭐ Strong',moderate:'⭐ Moderate',lean:'📊 Lean'};
  return`<span class="rb rb-${c}">${lbl[c]}</span>`;
}
function ccls(c){
  if(!c) return 'c-low';
  const l=c.toLowerCase();
  if(l.includes('high')) return 'c-high';
  if(l.includes('med'))  return 'c-med';
  return 'c-low';
}
function clbl(c){
  if(!c) return '—';
  const l=c.toLowerCase();
  if(l.includes('high')) return '🟢 High';
  if(l.includes('med'))  return '🟡 Med';
  return '🔴 Low';
}
function trcls(t){
  if(!t) return 't-neut';
  if(t.includes('Hot')||t.includes('🔥')) return 't-hot';
  if(t.includes('Cold')||t.includes('❄')) return 't-cold';
  return 't-neut';
}
function gcls(g){
  if(!g) return '';
  const l=g.trim().toUpperCase().replace(/[^A-F]/g,'')[0];
  return l?`g-${l}`:'';
}
function sr(k,v){ return`<div class="sr"><span class="sk">${k}</span><span class="sv">${v}</span></div>`; }

const DIVS={
  'AL East':   ['New York Yankees','Boston Red Sox','Toronto Blue Jays','Baltimore Orioles','Tampa Bay Rays'],
  'AL Central':['Cleveland Guardians','Chicago White Sox','Kansas City Royals','Minnesota Twins','Detroit Tigers'],

  'NL East':   ['Atlanta Braves','Philadelphia Phillies','New York Mets','Miami Marlins','Washington Nationals'],
  'NL Central':['Milwaukee Brewers','Chicago Cubs','St. Louis Cardinals','Pittsburgh Pirates','Cincinnati Reds'],
  'NL West':   ['Los Angeles Dodgers','San Diego Padres','Arizona Diamondbacks','San Francisco Giants','Colorado Rockies'],
};
function renderStandings(){
  if(!DATA.teamStats?.length){setMain('<div class="status-wrap">Standings not loaded yet.</div>');return;}
  const tsMap={};
  for(const t of DATA.teamStats) if(t['Team']) tsMap[t['Team']]=t;

  let html='<div class="std-grid">';
  for(const [div,teams] of Object.entries(DIVS)){
    const isAL=div.startsWith('AL');
    const sorted=[...teams].sort((a,b)=>{
      const ta=tsMap[a]||{},tb=tsMap[b]||{};
      const wa=+(ta['W']||0),la=+(ta['L']||0),wb=+(tb['W']||0),lb=+(tb['L']||0);
      return(wb/(wb+lb||1))-(wa/(wa+la||1));
    });
    const ldr=tsMap[sorted[0]]||{};
    const lw=+(ldr['W']||0),ll=+(ldr['L']||0);
    html+=`<div class="div-card"><div class="div-hdr ${isAL?'al':'nl'}">${isAL?'🔵':'🔴'} ${div}</div>
    <table class="std-tbl"><thead><tr><th>Team</th><th>W</th><th>L</th><th>PCT</th><th>GB</th><th>L10</th><th>Str</th></tr></thead><tbody>`;
    sorted.forEach((tn,i)=>{
      const t=tsMap[tn]||{};
      const w=+(t['W']||0),l=+(t['L']||0);
      const pct=(w+l)?(w/(w+l)).toFixed(3).replace(/^0/,''):'.000';
      const gbVal=i===0?'—':(((lw-w)+(l-ll))/2).toFixed(1).replace('.0','');
      const a=abbr(tn);
      const f=DATA.advanced?.teamForm?.[a]||DATA.advanced?.teamForm?.[tn]||{};
      const l10w=f['L10 W']||'—', l10l=f['L10 L']||'—';
      const l10=(l10w!=='—'&&l10l!=='—')?`${l10w}-${l10l}`:'—';
      const streak=f['Streak']||'—';
      const snum=parseInt(streak.replace(/[WL]/,''))||0;
      const scls=streak.startsWith('W')?'sk-hot':(streak.startsWith('L')&&snum>=2?'sk-cold':'');
      html+=`<tr${i===0?' class="leader"':''}><td>${sh(tn)}</td><td>${w}</td><td>${l}</td><td>${pct}</td><td class="gb-d">${gbVal}</td><td>${l10}</td><td class="${scls}">${streak}</td></tr>`;
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  setMain(html);
}

    return kl.includes(g.away.split(' ').pop().toLowerCase())&&kl.includes(g.home.split(' ').pop().toLowerCase());
  });
  const h2h=h2hKey?DATA.advanced.h2h[h2hKey]:{};
  const aBP=g.aBP||{},hBP=g.hBP||{};
  const aBPg=(g.aBP?.['Grade']||'').trim().charAt(0);
  const hBPg=(g.hBP?.['Grade']||'').trim().charAt(0);
  const pk=PARKS[g.homeAbbr];
  const roof=pk?.roof?'Dome':(g.roof||'Open');

  let h=`<div class="modal-title">⚾ ${g.away} <span style="color:var(--text2);font-weight:400">@</span> ${g.home}</div>`;

  // Win prob
  h+=`<div class="prob-wrap">
    <div class="prob-lbl">Full Game Win Probability</div>
    <div class="prob-bar-row">
      <span class="prob-pct" style="color:var(--blue)">${awayP}%</span>
      <div class="prob-bg"><div class="pb-a" style="width:${awayP}%"></div><div class="pb-h" style="width:${homeP}%"></div></div>
      <span class="prob-pct" style="color:var(--green);text-align:right">${homeP}%</span>
    </div>
    <div class="prob-teams">
      <span style="color:var(--blue);font-weight:600">${sh(g.away)}</span>
      <span>Proj ${g.awayFGruns} – ${g.homeFGruns} runs</span>
      <span style="color:var(--green);font-weight:600">${sh(g.home)}</span>
    </div>
  </div>`;

  // Run totals
  h+=`<div class="run-detail">
    <div class="rd-lbl">Projected Run Totals</div>
    <div class="rd-grid">
      <div class="rdc"><div class="rdc-l">${sh(g.away)} F5</div><div class="rdc-v rdc-a">${g.awayF5runs}</div></div>
      <div class="rdc"><div class="rdc-l">${sh(g.away)} FG</div><div class="rdc-v rdc-a">${g.awayFGruns}</div></div>
      <div class="rdc"><div class="rdc-l">${sh(g.home)} F5</div><div class="rdc-v rdc-h">${g.homeF5runs}</div></div>
      <div class="rdc"><div class="rdc-l">${sh(g.home)} FG</div><div class="rdc-v rdc-h">${g.homeFGruns}</div></div>
    </div>
    <div class="rd-totrow">
      <div class="rd-totcell"><div class="rdtc-l">F5 Total</div><div class="rdtc-v">${g.f5Total} <span style="font-size:10px" class="${ccls(g.f5Conf)}">${clbl(g.f5Conf)}</span></div></div>
      <div class="rd-totcell"><div class="rdtc-l">Game Total</div><div class="rdtc-v">${g.fgTotal} <span style="font-size:10px" class="${ccls(g.fgConf)}">${clbl(g.fgConf)}</span></div></div>
    </div>
  </div>`;

  // Park + weather
  h+=`<div class="wx-detail-box">
    <div class="wx-dl">Park &amp; Weather</div>
    <div style="font-size:12px;font-weight:500;margin-bottom:5px">${g.park||g.venue} <span style="color:var(--text2);font-weight:400">· ${g.parkFactor} · ${roof}${g.altitude?' · '+g.altitude+' ft':''}</span></div>
    <div style="font-size:12px;color:var(--text2)">${wxFull(g.homeAbbr)}</div>
  </div>`;

  // Team form
  h+=`<div class="m-hdr"><i class="ti ti-chart-line"></i> Team Form (Last 10)</div>
  <div class="two-col">
    <div class="m-box"><div class="m-box-title">${sh(g.away)}</div>
      ${sr('L10',aForm['L10 W']&&aForm['L10 L']?aForm['L10 W']+'-'+aForm['L10 L']:'—')}
      ${sr('Trend',`<span class="trend-b ${trcls(aForm['Trend']||'')}">${aForm['Trend']||'—'}</span>`)}
      ${sr('Streak',aForm['Streak']||'—')}
      ${sr('Season',g.awayRec||'—')}
      ${sr('ERA',g.aTS?.['ERA']||g.aTS?.['Team ERA']||'—')}
      ${sr('OPS',g.aTS?.['OPS']||'—')}
    </div>
    <div class="m-box"><div class="m-box-title">${sh(g.home)}</div>
      ${sr('L10',hForm['L10 W']&&hForm['L10 L']?hForm['L10 W']+'-'+hForm['L10 L']:'—')}
      ${sr('Trend',`<span class="trend-b ${trcls(hForm['Trend']||'')}">${hForm['Trend']||'—'}</span>`)}
      ${sr('Streak',hForm['Streak']||'—')}
      ${sr('Season',g.homeRec||'—')}
      ${sr('ERA',g.hTS?.['ERA']||g.hTS?.['Team ERA']||'—')}
      ${sr('OPS',g.hTS?.['OPS']||'—')}
    </div>
  </div>`;

  // SP
  h+=`<div class="m-hdr"><i class="ti ti-baseball"></i> Starting Pitchers</div>
  <div class="two-col">
    <div class="m-box"><div class="m-box-title">${g.awaySP}</div>
      ${sr('ERA',g.awayERA)} ${sr('WHIP',g.awayWHIP)}
      ${sr('L3 ERA',aSPF['L3 ERA']||aSPF['L3ERA']||'—')}
      ${sr('L3 WHIP',aSPF['L3 WHIP']||aSPF['L3WHIP']||'—')}
      ${sr('Trend',aSPF['Trend']||'—')}
      ${sr('K/9',g.aPit?.['K/9']||'—')} ${sr('BB/9',g.aPit?.['BB/9']||'—')}
    </div>
    <div class="m-box"><div class="m-box-title">${g.homeSP}</div>
      ${sr('ERA',g.homeERA)} ${sr('WHIP',g.homeWHIP)}
      ${sr('L3 ERA',hSPF['L3 ERA']||hSPF['L3ERA']||'—')}
      ${sr('L3 WHIP',hSPF['L3 WHIP']||hSPF['L3WHIP']||'—')}
      ${sr('Trend',hSPF['Trend']||'—')}
      ${sr('K/9',g.hPit?.['K/9']||'—')} ${sr('BB/9',g.hPit?.['BB/9']||'—')}
    </div>
  </div>`;

  // Bullpen
  h+=`<div class="m-hdr"><i class="ti ti-flame"></i> Bullpen</div>
  <div class="two-col">
    <div class="m-box"><div class="m-box-title">${sh(g.away)} <span class="bp-g ${gcls(aBPg)}">${aBPg||'—'}</span></div>
      ${sr('BP ERA',g.aBP?.['BP ERA']||'—')} ${sr('K/9',cleanK9(g.aBP?.['K/9'])||'—')}
      ${sr('Saves',g.aBP?.['Saves']||'—')} ${sr('Save%',g.aBP?.['Save%']||'—')}
      ${sr('Closer',g.aBP?.['Closer']||'—')}
      ${sr('Setup 1',g.aBP?.['Setup 1']||'—')} ${sr('Setup 2',g.aBP?.['Setup 2']||'—')}
    </div>
    <div class="m-box"><div class="m-box-title">${sh(g.home)} <span class="bp-g ${gcls(hBPg)}">${hBPg||'—'}</span></div>
      ${sr('BP ERA',g.hBP?.['BP ERA']||'—')} ${sr('K/9',cleanK9(g.hBP?.['K/9'])||'—')}
      ${sr('Saves',g.hBP?.['Saves']||'—')} ${sr('Save%',g.hBP?.['Save%']||'—')}
      ${sr('Closer',g.hBP?.['Closer']||'—')}
      ${sr('Setup 1',g.hBP?.['Setup 1']||'—')} ${sr('Setup 2',g.hBP?.['Setup 2']||'—')}
    </div>
  </div>`;

  // H2H
  if(Object.keys(h2h).length){
    h+=`<div class="m-hdr"><i class="ti ti-vs"></i> 2026 Head-to-Head</div>
    <div class="m-box">
      ${sr('Series Leader',h2h['Series Leader']||'—')}
      ${sr('Away Record',h2h['Away Record']||'—')}
      ${sr('Home Record',h2h['Home Record']||'—')}
      ${sr('Notes',h2h['Notes']||'—')}
    </div>`;
  }

  document.getElementById('modal-body').innerHTML=h;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
function closeOut(e){ if(e.target===document.getElementById('overlay')) closeModal(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

/* ─────────────────────────────────────────────
   INIT
───────────────────────────────────────────── */
loadAll();
</script>
</body>
</html>
