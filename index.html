// ── RFC 4180 CSV parser (handles newlines inside quoted fields) ────────────
function parseCSV(text){
  const rows=[];
  let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(inQ){
      if(ch==='"'&&nx==='"'){field+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else{field+=ch;}
    } else {
      if(ch==='"'){inQ=true;}
      else if(ch===','){row.push(field.trim());field='';}
      else if(ch==='\r'&&nx==='\n'){row.push(field.trim());rows.push(row);row=[];field='';i++;}
      else if(ch==='\r'||ch==='\n'){row.push(field.trim());rows.push(row);row=[];field='';}
      else{field+=ch;}
    }
  }
  if(field||row.length){row.push(field.trim());rows.push(row);}
  return rows;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function pct(s){return parseFloat((s||'').replace(/[^0-9.\-]/g,''))||0;}
function num(s){return parseFloat((s||'').replace(/[^0-9.\-]/g,''))||0;}
function isDash(s){const t=(s||'').trim();return t===''||t==='—'||t==='-'||t==='–';}
function cleanSP(s){
  // "Spencer Miles  (2.16)" → {name:"Spencer Miles", era:"2.16"}
  if(!s||isDash(s))return{name:'TBD',era:null,whip:null};
  const m=s.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
  if(m){const era=isDash(m[2])?null:m[2].trim();return{name:m[1].trim(),era};}
  return{name:s.trim(),era:null};
}
function rating(s){
  const u=(s||'').toUpperCase();
  if(u.includes('ELITE'))return'Elite';
  if(u.includes('STRONG'))return'Strong';
  if(u.includes('MODERATE'))return'Moderate';
  return'Lean';
}
function conf(s){
  const u=(s||'').toUpperCase();
  if(u.includes('HIGH'))return'High';
  if(u.includes('MED'))return'Med';
  return'Low';
}
function sn(t){return(t||'').split(' ').pop();}
function gc(g){return'grade-'+g.toLowerCase();}
function timeMin(t){
  const m=(t||'').match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m)return 0;
  let h=+m[1];
  if(m[3].toUpperCase()==='PM'&&h!==12)h+=12;
  if(m[3].toUpperCase()==='AM'&&h===12)h=0;
  return h*60+(+m[2]);
}

// ── Parse predictions tab ──────────────────────────────────────────────────
// Game rows: col0 contains "@" (matchup), col1 is time
// Section label rows: col0 contains "TODAY" or "TOMORROW"
function parsePreds(rows){
  const today=[],tomorrow=[];
  let section='today';
  for(const r of rows){
    const c0=(r[0]||'').trim();
    const c0up=c0.toUpperCase().replace(/[^\x20-\x7E]/g,'').trim();
    // Section label detection
    if(c0up.includes('TODAY')&&!c0.includes('@')){section='today';continue;}
    if(c0up.includes('TOMORROW')&&!c0.includes('@')){section='tomorrow';continue;}
    // Game row: must have @ in col0 and time in col1
    if(!c0.includes('@'))continue;
    if(!(r[1]||'').match(/\d+:\d+/))continue;
    const parts=c0.split('@');
    if(parts.length<2)continue;
    const away=parts[0].trim(),home=parts[1].trim();
    if(!away||!home)continue;
    const awaySP=cleanSP(r[2]),homeSP=cleanSP(r[3]);
    const f5PickRaw=(r[8]||'').trim();
    const fgPickRaw=(r[14]||'').trim();
    const f5aw=pct(r[6]),f5hw=pct(r[7]);
    const fgaw=pct(r[12]),fghw=pct(r[13]);
    const g={
      away,home,
      time:(r[1]||'').trim(),
      awaySP:awaySP.name, awayERA:awaySP.era, awayWHIP:null,
      homeSP:homeSP.name, homeERA:homeSP.era, homeWHIP:null,
      park:num(r[4]),
      wxAdj:(r[5]||'+0%').trim(),
      f5aw,f5hw,
      f5Pick:f5PickRaw,
      f5p:f5PickRaw.toLowerCase().includes(away.toLowerCase().split(' ').pop())?'away':'home',
      f5c:conf(r[9]),f5t:num(r[10]),
      fgaw,fghw,
      fgPick:fgPickRaw,
      fgp:fgPickRaw.toLowerCase().includes(away.toLowerCase().split(' ').pop())?'away':'home',
      fgc:conf(r[15]),fgt:num(r[16]),
      rating:rating(r[18]),
    };
    if(section==='tomorrow')tomorrow.push(g);
    else today.push(g);
  }
  return{today,tomorrow};
}

// ── Parse schedule tab for WHIP (col8=Away WHIP, col11=Home WHIP) ──────────
// Returns map: "Away@Home" → {awayWHIP, homeWHIP}
function parseSchedWHIP(rows){
  const map={};
  for(const r of rows){
    if(r.length<12)continue;
    const dayRaw=(r[1]||'').toLowerCase();
    if(!dayRaw.includes('today')&&!dayRaw.includes('tmrw')&&!dayRaw.includes('tomorrow'))continue;
    if(!(r[0]||'').match(/\d+:\d+/))continue;
    const away=(r[2]||'').trim(),home=(r[4]||'').trim();
    if(!away||!home)continue;
    map[away+'@'+home]={
      awayWHIP:isDash(r[8])?null:r[8].trim(),
      homeWHIP:isDash(r[11])?null:r[11].trim(),
      venue:(r[5]||'').trim(),
    };
  }
  return map;
}

// ── Load & fetch ───────────────────────────────────────────────────────────
async function loadData(){
  const btn=document.getElementById('refresh-btn');
  btn.disabled=true;btn.textContent='↻ LOADING...';
  document.getElementById('game-list').innerHTML=Array(5).fill('<div class="skeleton"></div>').join('');
  document.getElementById('summary-bar').innerHTML='<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--amber)">⟳ Fetching live data from Google Sheets...</span>';
  try{
    const [pr,sr]=await Promise.all([fetch(PREDS_URL),fetch(SCHED_URL)]);
    if(!pr.ok)throw new Error('Predictions tab HTTP '+pr.status);
    if(!sr.ok)throw new Error('Schedule tab HTTP '+sr.status);
    const [pt,st]=await Promise.all([pr.text(),sr.text()]);
    const predRows=parseCSV(pt);
    const schedRows=parseCSV(st);

    // Extract date from predictions tab header row
    const hdr=((predRows[0]||[])[0]||'').replace(/[^\x20-\x7E]/g,'').trim();
    const dm=hdr.match(/(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)[,.\s]+\w+\.?\s+\d+[,.\s]+\d{4}/i);
    if(dm)document.getElementById('sheet-date').textContent=dm[0].trim().substring(0,55);

    allGames=parsePreds(predRows);
    const whipMap=parseSchedWHIP(schedRows);

    // Inject WHIP into games
    for(const day of['today','tomorrow']){
      for(const g of allGames[day]){
        const w=whipMap[g.away+'@'+g.home]||{};
        if(w.awayWHIP)g.awayWHIP=w.awayWHIP;
        if(w.homeWHIP)g.homeWHIP=w.homeWHIP;
        if(w.venue)g.venue=w.venue;
      }
    }

    document.getElementById('tab-today').textContent='Today'+(allGames.today.length?' ('+allGames.today.length+')':'');
    document.getElementById('tab-tomorrow').textContent='Tomorrow'+(allGames.tomorrow.length?' ('+allGames.tomorrow.length+')':'');
  }catch(e){
    document.getElementById('game-list').innerHTML='<div class="no-games">⚠ Could not load sheet data<br><br><span style="font-size:10px;color:var(--muted2)">'+e.message+'</span></div>';
    document.getElementById('summary-bar').innerHTML='<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--red)">⚠ Load failed</span>';
    btn.disabled=false;btn.textContent='↻ REFRESH';return;
  }
  btn.disabled=false;btn.textContent='↻ REFRESH';
  render();
}

// ── Build row ──────────────────────────────────────────────────────────────
function pips(c){
  const n=c==='High'?3:c==='Med'?2:1,cls=c==='High'?'pip-high':c==='Med'?'pip-med':'pip-low';
  let h='';for(let i=0;i<3;i++)h+='<div class="conf-pip '+(i<n?cls:'pip-empty')+'"></div>';return h;
}
function pstat(era,whip){
  if(!era)return'<span class="pitcher-stats">TBD</span>';
  const w=whip?'<span style="color:var(--muted)"> · </span>WHIP <span class="sv">'+whip+'</span>':'';
  return'<span class="pitcher-stats">ERA <span class="sv">'+era+'</span>'+w+'</span>';
}

      +'<div class="pred-header">Full game pick</div>'
      +'<div class="pred-pick '+g.fgp+'">'+sn(g.fgPick)+'</div>'
      +'<div class="pred-totals"><span style="color:var(--green)">'+g.fgaw.toFixed(1)+'%</span><span style="color:var(--muted)">·</span><span style="color:var(--purple)">'+g.fghw.toFixed(1)+'%</span><span style="color:var(--muted);margin-left:4px">tot</span><span class="tv">'+g.fgt+'</span></div>'

        +'<div class="expand-row"><span class="expand-key">Away win%</span><span class="expand-val" style="color:var(--green)">'+g.f5aw.toFixed(1)+'%</span></div>'

        +'<div class="expand-row"><span class="expand-key">Away WHIP</span><span class="expand-val">'+(g.awayWHIP||'—')+'</span></div>'
        +'<div class="expand-row" style="margin-top:6px"><span class="expand-key">Home SP</span><span class="expand-val">'+g.homeSP+'</span></div>'

        +'<div class="expand-row"><span class="expand-key">Home WHIP</span><span class="expand-val">'+(g.homeWHIP||'—')+'</span></div>'
      +'</div>'
      +'<div>'
        +'<div class="expand-head">Bullpens</div>'
        +'<div class="expand-row"><span class="expand-key">'+sn(g.away)+' bp</span><span class="grade-pill '+gc(abp.grade)+'">'+abp.grade+'</span></div>'
        +'<div style="font-size:10px;color:var(--muted);margin-bottom:8px">'+abp.closer+' · ERA '+abp.era+'</div>'
        +'<div class="expand-row"><span class="expand-key">'+sn(g.home)+' bp</span><span class="grade-pill '+gc(hbp.grade)+'">'+hbp.grade+'</span></div>'
        +'<div style="font-size:10px;color:var(--muted);margin-bottom:8px">'+hbp.closer+' · ERA '+hbp.era+'</div>'
        +(g.wxAdj&&g.wxAdj!=='+0%'?'<div class="expand-row"><span class="expand-key">Weather adj</span><span class="expand-val" style="color:var(--green)">'+g.wxAdj+'</span></div>':'')

  row.addEventListener('click',()=>{
    const panel=row.querySelector('.expand-panel');

    panel.style.display=open?'grid':'none';
  });

function updateSummary(games){
  if(!games.length){document.getElementById('summary-bar').innerHTML='';return;}
  const elite=games.filter(g=>g.rating==='Elite').length;
  const strong=games.filter(g=>g.rating==='Strong').length;
  const hc=games.filter(g=>g.fgc==='High').length;
  const avg=(games.reduce((s,g)=>s+g.fgt,0)/games.length).toFixed(1);
  const ts=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('summary-bar').innerHTML=
    '<div class="sum-item"><div class="sdot" style="background:var(--green)"></div><span class="sum-label">Elite</span><span class="sum-val">'+elite+'</span></div>'
    +'<div class="sum-item"><div class="sdot" style="background:var(--blue)"></div><span class="sum-label">Strong</span><span class="sum-val">'+strong+'</span></div>'
    +'<div class="sum-item"><div class="sdot" style="background:var(--amber)"></div><span class="sum-label">High conf FG</span><span class="sum-val">'+hc+'</span></div>'
    +'<div class="sum-item"><div class="sdot" style="background:var(--muted)"></div><span class="sum-label">Avg FG total</span><span class="sum-val">'+avg+'</span></div>'
    +'<div class="sum-meta">Live · Google Sheets · '+ts+' · Click any row to expand</div>';
}

function render(){
  let games=[...(allGames[currentDay]||[])];
  if(currentFilter!=='all')games=games.filter(g=>g.rating===currentFilter);
  if(currentSort==='rating')games.sort((a,b)=>RO[a.rating]-RO[b.rating]);
  else if(currentSort==='total')games.sort((a,b)=>b.fgt-a.fgt);
  else games.sort((a,b)=>timeMin(a.time)-timeMin(b.time));
  const list=document.getElementById('game-list');
  list.innerHTML='';
  document.getElementById('count-label').textContent=games.length+' game'+(games.length!==1?'s':'');
  if(!games.length){list.innerHTML='<div class="no-games">NO GAMES FOUND</div>';updateSummary([]);return;}
  games.forEach(g=>list.appendChild(buildRow(g)));
  updateSummary(games);
}

function switchDay(d,btn){currentDay=d;document.querySelectorAll('.day-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function setSort(v){currentSort=v;render();}

loadData();
</script>
