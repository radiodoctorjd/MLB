// ── RFC 4180 CSV parser ────────────────────────────────────────────────────
function parseCSV(text) {
  const rows=[];
  let row=[], field='', inQ=false;
  for (let i=0; i<text.length; i++) {
    const ch=text[i], nx=text[i+1];
    if (inQ) {
      if (ch==='"' && nx==='"') { field+='"'; i++; }
      else if (ch==='"') { inQ=false; }
      else { field+=ch; }
    } else {
      if (ch==='"') { inQ=true; }
      else if (ch===',') { row.push(field.trim()); field=''; }
      else if (ch==='\r' && nx==='\n') { row.push(field.trim()); rows.push(row); row=[]; field=''; i++; }
      else if (ch==='\r' || ch==='\n') { row.push(field.trim()); rows.push(row); row=[]; field=''; }
      else { field+=ch; }
    }
  }
  if (field.length || row.length) { row.push(field.trim()); rows.push(row); }
  return rows;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function pct(s) { return parseFloat((s||'').replace(/[^0-9.\-]/g,''))||0; }
function num(s) { return parseFloat((s||'').replace(/[^0-9.\-]/g,''))||0; }
function spParse(s) {
  if (!s || s.trim()==='' || s.trim()==='—') return {name:'TBD', era:null};
  const m = s.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
  if (m) return {name:m[1].trim(), era:(m[2].trim()==='—'?null:m[2].trim())};
  return {name:s.trim(), era:null};
}
function getConf(s) {
  const u=(s||'').toUpperCase();
  if (u.includes('HIGH')) return 'High';
  if (u.includes('MED')) return 'Med';
  return 'Low';
}
function getRating(s) {
  const u=(s||'').toUpperCase();
  if (u.includes('ELITE')) return 'Elite';
  if (u.includes('STRONG')) return 'Strong';
  if (u.includes('MODERATE')) return 'Moderate';
  return 'Lean';
}
function timeMin(t) {
  const m=(t||'').match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return 0;
  let h=+m[1];
  if (m[3].toUpperCase()==='PM' && h!==12) h+=12;
  if (m[3].toUpperCase()==='AM' && h===12) h=0;
  return h*60+(+m[2]);
}

function logoImg(team, size) {
  const url = LOGOS[team];
  if (!url) return '';
  return '<img src="'+url+'" alt="'+team+'" class="team-logo" style="width:'+size+'px;height:'+size+'px" onerror="this.style.display=\'none\'">';
}

// ── Parse predictions tab ──────────────────────────────────────────────────
function parsePreds(rows) {
  GAMES = {today:[], tomorrow:[]};
  let section = 'today';
  for (const r of rows) {
    const c0 = (r[0]||'').trim();
    if (!c0.includes('@')) {
      const up = c0.replace(/[^A-Za-z]/g,'').toUpperCase();
      if (up.includes('TOMORROW')) { section='tomorrow'; continue; }
      if (up.includes('TODAY')) { section='today'; continue; }
      continue;
    }
    const t = (r[1]||'').trim();
    if (!t.match(/\d+:\d+/)) continue;
    const parts = c0.split('@');
    if (parts.length < 2) continue;
    const away = parts[0].trim(), home = parts[1].trim();
    if (!away || !home) continue;
    const asp = spParse(r[2]), hsp = spParse(r[3]);
    const f5aw=pct(r[6]), f5hw=pct(r[7]);
    const fgaw=pct(r[12]), fghw=pct(r[13]);
    const f5Pick=(r[8]||'').trim(), fgPick=(r[14]||'').trim();
    const g = {
      away, home, time:t, venue:'',
      awaySP:asp.name, awayERA:asp.era, awayWHIP:null,
      homeSP:hsp.name, homeERA:hsp.era, homeWHIP:null,
      park:num(r[4]), wxAdj:(r[5]||'+0%').trim(),
      f5aw, f5hw, f5Pick,
      f5p: f5Pick.toLowerCase().includes(away.toLowerCase().split(' ').pop()) ? 'away' : 'home',
      f5c: getConf(r[9]), f5t: num(r[10]),
      fgaw, fghw, fgPick,
      fgp: fgPick.toLowerCase().includes(away.toLowerCase().split(' ').pop()) ? 'away' : 'home',
      fgc: getConf(r[15]), fgt: num(r[16]),
      rating: getRating(r[18]),
    };
    GAMES[section].push(g);
  }
}

// ── Parse schedule tab for WHIP + venue ────────────────────────────────────
function parseSchedWHIP(rows) {
  const map = {};
  for (const r of rows) {
    if (r.length < 12) continue;
    const d = (r[1]||'').toLowerCase();
    if (!d.includes('today') && !d.includes('tmrw') && !d.includes('tomorrow')) continue;
    if (!(r[0]||'').match(/\d+:\d+/)) continue;
    const away=(r[2]||'').trim(), home=(r[4]||'').trim();
    if (!away || !home) continue;
    const aw=(r[8]||'').trim(), hw=(r[11]||'').trim();
    map[away+'|'+home] = {
      awayWHIP: (aw===''||aw==='—') ? null : aw,
      homeWHIP: (hw===''||hw==='—') ? null : hw,
      venue: (r[5]||'').trim(),
    };
  }
  for (const section of ['today','tomorrow']) {
    for (const g of GAMES[section]) {
      const w = map[g.away+'|'+g.home];
      if (w) {
        if (w.awayWHIP) g.awayWHIP = w.awayWHIP;
        if (w.homeWHIP) g.homeWHIP = w.homeWHIP;
        if (w.venue) g.venue = w.venue;
      }
    }
  }
}

// ── Load data ──────────────────────────────────────────────────────────────
async function loadData() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled=true; btn.textContent='↻ LOADING...';
  document.getElementById('game-list').innerHTML = Array(5).fill('<div class="skeleton"></div>').join('');
  document.getElementById('summary-bar').innerHTML = '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--amber)">⟳ Fetching live data from Google Sheets...</span>';
  try {
    const [pr, sr] = await Promise.all([fetch(PREDS_URL), fetch(SCHED_URL)]);
    if (!pr.ok) throw new Error('Predictions tab HTTP '+pr.status);
    if (!sr.ok) throw new Error('Schedule tab HTTP '+sr.status);
    const [pt, st] = await Promise.all([pr.text(), sr.text()]);
    const predRows = parseCSV(pt);
    const schedRows = parseCSV(st);
    // Extract date from header
    const hdr = ((predRows[0]||[])[0]||'').replace(/[^\x20-\x7E]/g,'').trim();
    const dm = hdr.match(/(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday).{0,30}\d{4}/i);
    if (dm) document.getElementById('sheet-date').textContent = dm[0].trim().substring(0,55);
    parsePreds(predRows);
    parseSchedWHIP(schedRows);
    document.getElementById('tab-today').textContent = 'Today' + (GAMES.today.length ? ' ('+GAMES.today.length+')' : '');
    document.getElementById('tab-tomorrow').textContent = 'Tomorrow' + (GAMES.tomorrow.length ? ' ('+GAMES.tomorrow.length+')' : '');
  } catch(e) {
    document.getElementById('game-list').innerHTML = '<div class="no-games">⚠ Could not load sheet data<br><br><span style="font-size:10px;color:var(--muted2)">'+e.message+'</span></div>';
    document.getElementById('summary-bar').innerHTML = '<span style="font-family:\'IBM Plex Mono\',monospace;font-size:10px;color:var(--red)">⚠ Load failed</span>';
    btn.disabled=false; btn.textContent='↻ REFRESH';
    return;
  }
  // Show debug info on page
  const dbg = document.getElementById('debug-out');
  if (dbg) dbg.innerHTML =
    'Today: '+GAMES.today.length+' games | Tomorrow: '+GAMES.tomorrow.length+' games<br>'
    +'First today row: '+(GAMES.today[0]?JSON.stringify({away:GAMES.today[0].away,home:GAMES.today[0].home,rating:GAMES.today[0].rating,f5t:GAMES.today[0].f5t,fgt:GAMES.today[0].fgt}):'none');

  btn.disabled=false; btn.textContent='↻ REFRESH';
  render();
}

// ── Build row ──────────────────────────────────────────────────────────────
function pips(c) {
  const n=c==='High'?3:c==='Med'?2:1, cls=c==='High'?'pip-high':c==='Med'?'pip-med':'pip-low';
  let h=''; for(let i=0;i<3;i++) h+='<div class="conf-pip '+(i<n?cls:'pip-empty')+'"></div>'; return h;
}
function pstat(era, whip) {
  if (!era) return '<span class="pitcher-stats">TBD</span>';
  const w = whip ? ' <span style="color:var(--muted)">·</span> WHIP <span class="sv">'+whip+'</span>' : '';
  return '<span class="pitcher-stats">ERA <span class="sv">'+era+'</span>'+w+'</span>';
}

function buildRow(g) {
  const rl = g.rating.toLowerCase();
  const stars = g.rating==='Elite'?'★★★':g.rating==='Strong'?'★★':g.rating==='Moderate'?'★':'·';
  const parkLabel = g.park>=1.1?' 🔥':g.park<=0.92?' ❄️':'';
  const wxStr = (g.wxAdj && g.wxAdj!=='+0%' && g.wxAdj!=='0%') ? ' · <span style="color:var(--green)">'+g.wxAdj+'</span>' : '';
  const abp = BULLPEN[g.away]||{grade:'?',era:'?',closer:'?'};
  const hbp = BULLPEN[g.home]||{grade:'?',era:'?',closer:'?'};
  const awayLogo = logoImg(g.away, 22);
  const homeLogo = logoImg(g.home, 22);
  const f5PickName = g.f5p==='away' ? g.away : g.home;
  const fgPickName = g.fgp==='away' ? g.away : g.home;

  const row = document.createElement('div');
  row.className = 'game-row';
  row.setAttribute('data-rating', g.rating);
  row.innerHTML =
    '<div class="cell">'
      +'<div class="matchup-time">'+g.time+'</div>'
      +'<div class="matchup-logos">'
        +awayLogo
        +'<span class="team-name">'+sn(g.away)+'</span>'
        +'<span class="vs-sep">@</span>'
        +homeLogo
        +'<span class="team-name">'+sn(g.home)+'</span>'
      +'</div>'
      +'<div class="matchup-sub">'+(g.park?'Park '+g.park+parkLabel:'')+(g.venue?' · '+g.venue:'')+wxStr+'</div>'
    +'</div>'
    +'<div class="cell">'
      +'<div class="pitcher-line"><span class="pitcher-side">AWY</span><span class="pitcher-name">'+g.awaySP+'</span>'+pstat(g.awayERA,g.awayWHIP)+'</div>'
      +'<div class="pitcher-line" style="margin-top:3px"><span class="pitcher-side">HME</span><span class="pitcher-name">'+g.homeSP+'</span>'+pstat(g.homeERA,g.homeWHIP)+'</div>'
    +'</div>'
    +'<div class="cell">'
      +'<div class="pred-header">F5 pick</div>'
      +'<div class="pred-pick '+g.f5p+'">'+sn(f5PickName)+'</div>'
      +'<div class="pred-totals"><span style="color:var(--green)">'+g.f5aw.toFixed(1)+'%</span><span style="color:var(--muted)">·</span><span style="color:var(--purple)">'+g.f5hw.toFixed(1)+'%</span><span style="color:var(--muted);margin-left:4px">tot</span><span class="tv">'+g.f5t+'</span></div>'
      +'<div class="win-mini"><div class="wma" style="width:'+g.f5aw+'%"></div><div class="wmh" style="width:'+g.f5hw+'%"></div></div>'
      +'<div class="win-pcts">'+g.f5c+' conf</div>'
    +'</div>'
    +'<div class="cell">'
      +'<div class="pred-header">Full game pick</div>'
      +'<div class="pred-pick '+g.fgp+'">'+sn(fgPickName)+'</div>'
      +'<div class="pred-totals"><span style="color:var(--green)">'+g.fgaw.toFixed(1)+'%</span><span style="color:var(--muted)">·</span><span style="color:var(--purple)">'+g.fghw.toFixed(1)+'%</span><span style="color:var(--muted);margin-left:4px">tot</span><span class="tv">'+g.fgt+'</span></div>'
      +'<div class="win-mini"><div class="wma" style="width:'+g.fgaw+'%"></div><div class="wmh" style="width:'+g.fghw+'%"></div></div>'
      +'<div class="win-pcts">'+g.fgc+' conf</div>'
    +'</div>'
    +'<div class="cell rating-cell">'
      +'<div class="rating-stars">'+stars+'</div>'
      +'<div class="rating-label '+rl+'">'+g.rating.toUpperCase()+'</div>'
      +'<div class="conf-indicator">'+pips(g.fgc)+'</div>'
    +'</div>'
    +'<div class="expand-panel">'
      +'<div>'
        +'<div class="expand-head">F5 breakdown</div>'
        +'<div class="expand-row"><span class="expand-key">Pick</span><span class="expand-val" style="color:'+(g.f5p==='away'?'var(--green)':'var(--purple)')+'">'+g.f5Pick+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Away win%</span><span class="expand-val" style="color:var(--green)">'+g.f5aw.toFixed(1)+'%</span></div>'
        +'<div class="expand-row"><span class="expand-key">Home win%</span><span class="expand-val" style="color:var(--purple)">'+g.f5hw.toFixed(1)+'%</span></div>'
        +'<div class="expand-row"><span class="expand-key">F5 total</span><span class="expand-val">'+g.f5t+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Confidence</span><span class="expand-val">'+g.f5c+'</span></div>'
        +'<div class="expand-bar-wrap"><div class="expand-bar-row"><span class="expand-bar-label">AWY</span><div class="expand-bar-track"><div class="expand-bar-fill-a" style="width:'+g.f5aw+'%"></div></div><span class="expand-bar-pct">'+g.f5aw.toFixed(1)+'%</span></div><div class="expand-bar-row"><span class="expand-bar-label">HME</span><div class="expand-bar-track"><div class="expand-bar-fill-h" style="width:'+g.f5hw+'%"></div></div><span class="expand-bar-pct">'+g.f5hw.toFixed(1)+'%</span></div></div>'
      +'</div>'
      +'<div>'
        +'<div class="expand-head">Full game breakdown</div>'
        +'<div class="expand-row"><span class="expand-key">Pick</span><span class="expand-val" style="color:'+(g.fgp==='away'?'var(--green)':'var(--purple)')+'">'+g.fgPick+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Away win%</span><span class="expand-val" style="color:var(--green)">'+g.fgaw.toFixed(1)+'%</span></div>'
        +'<div class="expand-row"><span class="expand-key">Home win%</span><span class="expand-val" style="color:var(--purple)">'+g.fghw.toFixed(1)+'%</span></div>'
        +'<div class="expand-row"><span class="expand-key">FG total</span><span class="expand-val">'+g.fgt+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Confidence</span><span class="expand-val">'+g.fgc+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Park factor</span><span class="expand-val">'+g.park+parkLabel+'</span></div>'
        +'<div class="expand-bar-wrap"><div class="expand-bar-row"><span class="expand-bar-label">AWY</span><div class="expand-bar-track"><div class="expand-bar-fill-a" style="width:'+g.fgaw+'%"></div></div><span class="expand-bar-pct">'+g.fgaw.toFixed(1)+'%</span></div><div class="expand-bar-row"><span class="expand-bar-label">HME</span><div class="expand-bar-track"><div class="expand-bar-fill-h" style="width:'+g.fghw+'%"></div></div><span class="expand-bar-pct">'+g.fghw.toFixed(1)+'%</span></div></div>'
      +'</div>'
      +'<div>'
        +'<div class="expand-head">Starting pitchers</div>'
        +'<div class="expand-row"><span class="expand-key">Away SP</span><span class="expand-val">'+g.awaySP+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Away ERA</span><span class="expand-val">'+(g.awayERA||'—')+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Away WHIP</span><span class="expand-val">'+(g.awayWHIP||'—')+'</span></div>'
        +'<div class="expand-row" style="margin-top:6px"><span class="expand-key">Home SP</span><span class="expand-val">'+g.homeSP+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Home ERA</span><span class="expand-val">'+(g.homeERA||'—')+'</span></div>'
        +'<div class="expand-row"><span class="expand-key">Home WHIP</span><span class="expand-val">'+(g.homeWHIP||'—')+'</span></div>'
      +'</div>'
      +'<div>'
        +'<div class="expand-head">Bullpens</div>'
        +'<div class="expand-row"><span class="expand-key">'+sn(g.away)+' bp</span><span class="grade-pill '+gc(abp.grade)+'">'+abp.grade+'</span></div>'
        +'<div style="font-size:10px;color:var(--muted);margin-bottom:8px">'+abp.closer+' · ERA '+abp.era+'</div>'
        +'<div class="expand-row"><span class="expand-key">'+sn(g.home)+' bp</span><span class="grade-pill '+gc(hbp.grade)+'">'+hbp.grade+'</span></div>'
        +'<div style="font-size:10px;color:var(--muted);margin-bottom:8px">'+hbp.closer+' · ERA '+hbp.era+'</div>'
        +(g.wxAdj&&g.wxAdj!=='+0%'?'<div class="expand-row"><span class="expand-key">Weather adj</span><span class="expand-val" style="color:var(--green)">'+g.wxAdj+'</span></div>':'')
        +(g.venue?'<div class="expand-row" style="margin-top:4px"><span class="expand-key">Venue</span><span class="expand-val" style="font-size:10px">'+g.venue+'</span></div>':'')
      +'</div>'
    +'</div>'
    +'<span class="chevron">▼</span>';

  row.addEventListener('click', () => {
    const panel = row.querySelector('.expand-panel');
    const open = row.classList.toggle('expanded');
    panel.style.display = open ? 'grid' : 'none';
  });
  return row;
}

// ── Render ─────────────────────────────────────────────────────────────────
function updateSummary(games) {
  if (!games.length) { document.getElementById('summary-bar').innerHTML=''; return; }
  const elite=games.filter(g=>g.rating==='Elite').length;
  const strong=games.filter(g=>g.rating==='Strong').length;
  const hc=games.filter(g=>g.fgc==='High').length;
  const avg=(games.reduce((s,g)=>s+g.fgt,0)/games.length).toFixed(1);
  const ts=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('summary-bar').innerHTML =
    '<div class="sum-item"><div class="sdot" style="background:var(--green)"></div><span class="sum-label">Elite</span><span class="sum-val">'+elite+'</span></div>'
    +'<div class="sum-item"><div class="sdot" style="background:var(--blue)"></div><span class="sum-label">Strong</span><span class="sum-val">'+strong+'</span></div>'
    +'<div class="sum-item"><div class="sdot" style="background:var(--amber)"></div><span class="sum-label">High conf FG</span><span class="sum-val">'+hc+'</span></div>'
    +'<div class="sum-item"><div class="sdot" style="background:var(--muted)"></div><span class="sum-label">Avg FG total</span><span class="sum-val">'+avg+'</span></div>'
    +'<div class="sum-meta">Live · Google Sheets · '+ts+' · Click any row to expand</div>';
}

function render() {
  let games = [...(GAMES[currentDay]||[])];
  if (currentFilter!=='all') games = games.filter(g=>g.rating===currentFilter);
  if (currentSort==='rating') games.sort((a,b)=>RO[a.rating]-RO[b.rating]);
  else if (currentSort==='total') games.sort((a,b)=>b.fgt-a.fgt);
  else games.sort((a,b)=>timeMin(a.time)-timeMin(b.time));
  const list = document.getElementById('game-list');
  list.innerHTML = '';
  document.getElementById('count-label').textContent = games.length+' game'+(games.length!==1?'s':'');
  if (!games.length) { list.innerHTML='<div class="no-games">NO GAMES FOUND</div>'; updateSummary([]); return; }
  games.forEach(g => list.appendChild(buildRow(g)));
  updateSummary(games);
}

function switchDay(d, btn) { currentDay=d; document.querySelectorAll('.day-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }
function setFilter(f, btn) { currentFilter=f; document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }
function setSort(v) { currentSort=v; render(); }

loadData();
</script>
